 o:["De strategische doelen en richting formuleren en de belangrijke beslissingen nemen","Strategie vertalen naar operationele plannen","Het dagelijkse werk voor de klant uitvoeren","Specialistisch advies geven"], a:0,
 w:["","Dat doet de middenlijn.","Dat doet de operationele kern.","Dat doet de technische staf."],
 e:"De strategische top (topmanagement) staat bovenaan. Het zijn de leidinggevenden die de strategische doelen en richting bepalen en de beslissingen nemen die de toekomst van de organisatie beïnvloeden."},

{c:"proces", q:"In een supermarktketen vertalen de filiaalmanagers de plannen van de directie naar concrete acties in hun winkel en coördineren ze het werk. Bij welke component van Mintzberg horen zij?",
 o:["Middenlijn","Strategische top","Operationele kern","Ondersteunende staf"], a:0,
 w:["","De directie zelf is de strategische top. De filiaalmanagers zitten daaronder.","De operationele kern zijn de mensen die het werk zelf doen, zoals de kassiers.","De ondersteunende staf levert diensten zoals HR, niet de aansturing van winkels."],
 e:"De middenlijn (middenkader) zit tussen top en kern. Ze vertalen strategische beslissingen naar operationele plannen en coördineren het werk op operationeel niveau."},

{c:"proces", q:"Welke component van Mintzberg wordt in de stof 'het hart van de organisatie' genoemd?",
 o:["De operationele kern","De strategische top","De technische staf","De middenlijn"], a:0,
 w:["","De top bepaalt de richting, maar is niet het hart.","De technische staf geeft advies, maar voert het kernwerk niet uit.","De middenlijn coördineert, maar voert het kernwerk niet uit."],
 e:"De operationele (uitvoerende) kern is het hart: de medewerkers die direct betrokken zijn bij de dagelijkse activiteiten die waarde creëren voor de klant. Zij zorgen voor productie of dienstverlening."},

{c:"proces", q:"Bij welke component van Mintzberg horen de leerkrachten die lesgeven in een school?",
 o:["Operationele kern","Middenlijn","Technische staf","Ondersteunende staf"], a:0,
 w:["","De middenlijn zijn bijvoorbeeld de coördinatoren die het werk aansturen.","De technische staf geeft advies over hoe het werk moet, ze geven zelf geen les.","De ondersteunende staf levert diensten zoals de administratie."],
 e:"Leerkrachten voeren het kernwerk uit dat rechtstreeks waarde creëert voor de 'klant' (de leerlingen). Dat is de operationele kern."},

{c:"proces", q:"Een fabriek heeft ingenieurs die adviseren hoe de productielijn ingericht moet worden. Bij welke component van Mintzberg horen zij?",
 o:["Technische staf","Ondersteunende staf","Operationele kern","Strategische top"], a:0,
 w:["","De ondersteunende staf levert diensten zoals HR en schoonmaak, geen technisch expertadvies.","De operationele kern voert het werk zelf uit. De ingenieurs adviseren hoe het moet.","De top bepaalt de strategie, niet de inrichting van de productielijn."],
 e:"De technische staf bestaat uit experts met specialistische kennis die advies geven aan de rest van de organisatie. De stof noemt ingenieurs, IT-specialisten en juridische adviseurs."},

{c:"proces", q:"Welke drie voorbeelden van technische staf noemt de stof?",
 o:["Ingenieurs, IT-specialisten en juridische adviseurs","HR, financiën en administratie","Directeur, CEO en bestuur","Kassiers, monteurs en koks"], a:0,
 w:["","Dat zijn voorbeelden van de ondersteunende staf.","Dat is de strategische top.","Dat zijn mensen uit de operationele kern."],
 e:"Technische staf = experts met specialistische kennis die advies geven: ingenieurs, IT-specialisten, juridische adviseurs."},

{c:"proces", q:"In een groot bedrijf zorgt een team voor de schoonmaak en het onderhoud van de gebouwen (facilitair management). Bij welke component van Mintzberg hoort dit team?",
 o:["Ondersteunende staf","Technische staf","Operationele kern","Middenlijn"], a:0,
 w:["","De technische staf geeft expertadvies over hoe het werk moet. Schoonmaak is een dienst.","Ze zijn niet betrokken bij de kernactiviteiten van het bedrijf.","De middenlijn coördineert het kernwerk, ze maakt niet schoon."],
 e:"De ondersteunende staf levert diensten zodat de organisatie soepel draait, maar is niet betrokken bij de kernactiviteiten. De stof noemt HR, financiën, administratie en facilitair management."},

{c:"proces", q:"Wat is het verschil tussen de technische staf en de ondersteunende staf bij Mintzberg?",
 o:["De technische staf geeft specialistisch advies, de ondersteunende staf levert diensten zoals HR en administratie","De technische staf voert het kernwerk uit, de ondersteunende staf niet","De ondersteunende staf bepaalt de strategie","Er is geen verschil, het zijn synoniemen"], a:0,
 w:["","Het kernwerk wordt door de operationele kern uitgevoerd, niet door de technische staf.","De strategie wordt bepaald door de strategische top.","Er is wel een verschil: advies tegenover diensten."],
 e:"Beide staan naast de lijn en voeren het kernwerk niet zelf uit. Technische staf = experts die advies geven (ingenieurs, IT, juristen). Ondersteunende staf = diensten die alles laten draaien (HR, financiën, administratie, facilitair)."},

{c:"proces", q:"Wat is een organigram?",
 o:["Een visuele weergave van de structuur van een organisatie: de hiërarchie en relaties tussen afdelingen, functies en medewerkers","Een schema van de stappen van één proces","Een tabel van welke systemen welke data gebruiken","Een overzicht van de kosten per afdeling"], a:0,
 w:["","Dat is een procesflow schema.","Dat is een system/data matrix, uit het hoofdstuk automatisering.","Een organigram toont geen kosten."],
 e:"Een organigram (organisatieschema) toont de hiërarchie: wie staat boven wie, welke afdelingen er zijn en hoe ze met elkaar verbonden zijn. Kort: wie is de baas van wie."},

{c:"proces", q:"Een nieuwe medewerker wil weten bij welke afdeling hij hoort en wie de leidinggevende van zijn leidinggevende is. Welk schema helpt hem?",
 o:["Een organigram","Een procesflow schema","Een hiërarchisch processchema","Het Black-box model"], a:0,
 w:["","Een procesflow schema toont stappen van een proces, geen mensen.","Een hiërarchisch processchema toont processen in niveaus, geen mensen.","Het Black-box model gaat over input en output van een proces."],
 e:"Het organigram is het enige schema dat over mensen en afdelingen gaat. De andere schema's gaan over processen."},

{c:"proces", q:"Welke vier elementen gaan in het Black-box model het systeem in en uit?",
 o:["Triggers, input, activiteiten en output","Plan, Do, Check en Act","Input, filter, feedback en output","Top, middenlijn, kern en staf"], a:0,
 w:["","Dat is de PDCA-cyclus.","Filter en feedback horen bij processturing.","Dat zijn componenten van Mintzberg."],
 e:"Het Black-box model ziet een proces als een gesloten doos met triggers (aanleidingen), input (bronnen), activiteiten (handelingen) en output (resultaten). De focus ligt op de omzetting van input naar output."},

{c:"proces", q:"Waarom heet het Black-box model zo?",
 o:["Omdat het proces zelf als een gesloten doos wordt gezien: je kijkt naar wat erin gaat en eruit komt, niet naar wat erin gebeurt","Omdat het altijd zwart getekend wordt","Omdat het alleen geheime processen beschrijft","Omdat het gaat over de vluchtrecorder van een vliegtuig"], a:0,
 w:["","De kleur van de tekening heeft er niets mee te maken.","Het geldt voor alle processen, niet alleen geheime.","Het heeft niets met vliegtuigen te maken."],
 e:"Bij het Black-box model kijk je niet in de doos. Je richt je op de omzetting van input naar output, en het proces zelf is een gesloten doos."},

{c:"proces", q:"Een klant belt een loodgieter omdat zijn kraan lekt. De loodgieter repareert de kraan met een nieuw onderdeel. Wat is in het Black-box model de TRIGGER?",
 o:["Het telefoontje van de klant","Het nieuwe onderdeel","De gerepareerde kraan","Het repareren zelf"], a:0,
 w:["","Het onderdeel wordt verwerkt in het proces: dat is input.","De gerepareerde kraan is het resultaat: output.","Repareren is een activiteit."],
 e:"De trigger is de aanleiding die het proces start. Zonder telefoontje begint de loodgieter niet, ook al ligt het onderdeel klaar. Trigger = wat het proces start, input = wat erin verwerkt wordt."},

{c:"proces", q:"Wat is processturing?",
 o:["Een proces bewust beïnvloeden zodat het de gewenste resultaten oplevert, door te plannen, monitoren en aanpassen","Een tekening van de stappen van een proces","De hiërarchie van een organisatie","Het uitbesteden van een proces aan een partner"], a:0,
 w:["","Dat is een procesflow schema.","Dat is een organigram.","Uitbesteden hoort bij Make or Buy of Key Partnerships, niet bij processturing."],
 e:"Processturing is het bewust beïnvloeden van een proces: plannen, monitoren en bijsturen om de prestaties te optimaliseren. Het kan reactief (terugkoppeling) of proactief (vooruitkoppeling) zijn."},

{c:"proces", q:"Processturing kan op twee manieren. Welke?",
 o:["Reactief en proactief","Serieel en parallel","Primair en ondersteunend","Kwalitatief en kwantitatief"], a:0,
 w:["","Dat zijn manieren om processen in te richten, geen vormen van sturing.","Dat zijn soorten processen.","Dat gaat over soorten waarden in een Value Proposition."],
 e:"Processturing kan reactief zijn (achteraf bijsturen via terugkoppeling) of proactief (vooraf ingrijpen via vooruitkoppeling)."},

{c:"proces", q:"Een restaurant leest de reviews van vorige maand, ziet veel klachten over koude gerechten en past daarom de werkwijze in de keuken aan. Welk principe is dit?",
 o:["Terugkoppeling (feedback)","Vooruitkoppeling (feedforward)","Een filter","Een parallel proces"], a:0,
 w:["","Vooruitkoppeling grijpt in voordat het probleem er is. Hier was het probleem er al.","Een filter selecteert informatie, maar hier wordt ook bijgestuurd na meting.","Parallel gaat over taken die tegelijk gebeuren."],
 e:"Terugkoppeling: de output wordt gemeten en geanalyseerd, en op basis daarvan wordt het proces bijgestuurd. Het probleem is al gebeurd, dus het is reactief."},

{c:"proces", q:"Wat gebeurt er in stap 4 van terugkoppeling (in het Black-box model)?",
 o:["De output wordt gemeten en geanalyseerd, bijvoorbeeld op kwaliteit, snelheid, kosten of klanttevredenheid","De input gaat de black box in","Er worden corrigerende maatregelen genomen","De output wordt geproduceerd"], a:0,
 w:["","Dat is stap 1.","Dat is stap 5, actie en aanpassing.","Dat is stap 3."],
 e:"De 5 stappen: (1) input gaat erin, (2) proces in de black box, (3) output komt eruit, (4) terugkoppeling: output meten en analyseren, (5) actie: bijsturen als de output niet voldoet."},

{c:"proces", q:"Een bedrijf meet dat 6% van de producten kapot is, terwijl de norm 2% is. Het past daarom een machine aan. Welke stap van terugkoppeling is 'de machine aanpassen'?",
 o:["Actie/aanpassing","Input","Output","Proces (black box)"], a:0,
 w:["","Input is wat het proces binnenkomt.","Output is wat het proces produceert.","Het proces is wat binnenin de doos gebeurt, niet de bijsturing."],
 e:"Na het meten (6% kapot) volgt de laatste stap: actie/aanpassing. Als de output niet voldoet aan de norm, neem je corrigerende maatregelen om het proces bij te sturen."},

{c:"proces", q:"Waar staan de letters PDCA voor?",
 o:["Plan, Do, Check, Act","Process, Data, Control, Analyse","Plan, Design, Create, Apply","Predict, Do, Correct, Adjust"], a:0,
 w:["","Deze woorden staan niet in de stof.","Deze woorden staan niet in de stof.","Deze woorden staan niet in de stof."],
 e:"PDCA = Plan (plannen), Do (uitvoeren), Check (controleren), Act (aanpassen). Een cyclus om continu te leren en te verbeteren, nauw verbonden met terugkoppeling."},

{c:"proces", q:"In welke fase van de PDCA-cyclus worden doelen gesteld, middelen bepaald en verantwoordelijkheden verdeeld?",
 o:["Plan","Do","Check","Act"], a:0,
 w:["","In Do wordt het plan uitgevoerd.","In Check worden de resultaten vergeleken met de doelen.","In Act worden corrigerende acties genomen."],
 e:"In de Plan-fase stel je een plan op: doelen, benodigde middelen, verantwoordelijkheden en procedures. Terugkoppeling helpt hier door gegevens uit het verleden te gebruiken."},

{c:"proces", q:"Een team test een nieuwe werkwijze en vergelijkt na een maand de resultaten met de doelen. Ze stellen vast dat het doel niet gehaald is. In welke PDCA-fase zitten ze?",
 o:["Check","Act","Do","Plan"], a:0,
 w:["","In Act doe je er iets aan. Hier stellen ze alleen vast.","Do is het uitvoeren. Dat was de maand testen.","Plan is het opstellen van het plan, vóór de uitvoering."],
 e:"Check = resultaten evalueren en vergelijken met de doelen. Pas in Act neem je corrigerende acties op basis van wat je in Check vond."},

{c:"proces", q:"Wat gebeurt er in de Act-fase van de PDCA-cyclus?",
 o:["Op basis van de bevindingen uit Check worden corrigerende acties genomen","Het plan wordt voor het eerst opgesteld","Het plan wordt uitgevoerd","De resultaten worden vergeleken met de doelen"], a:0,
 w:["","Dat is Plan.","Dat is Do.","Dat is Check."],
 e:"In Act pas je aan: als Check toont dat het proces niet goed presteert, worden verbetermaatregelen voorgesteld en ingevoerd. Daarna begint de cyclus opnieuw."},

{c:"proces", q:"Wat is de rol van terugkoppeling in de Do-fase van PDCA?",
 o:["De uitvoering volgen en meten, en afwijkingen of problemen vastleggen","Doelen stellen voor het plan","Corrigerende maatregelen kiezen","Het proces stopzetten"], a:0,
 w:["","Doelen stellen gebeurt in Plan.","Maatregelen kiezen gebeurt in Act.","Daar staat niets over in de stof."],
 e:"In Do wordt het plan uitgevoerd. Terugkoppeling volgt en meet hoe het proces presteert in vergelijking met het plan, en legt afwijkingen en onverwachte problemen vast."},

{c:"proces", q:"Een manager krijgt per week 2.000 meldingen uit het systeem, maar krijgt alleen de meldingen te zien die boven een bepaalde grens uitkomen. Wat is dit?",
 o:["Een filter","Vooruitkoppeling","Een KPI","Een beslissingspunt"], a:0,
 w:["","Vooruitkoppeling voorspelt de toekomst. Hier wordt informatie geselecteerd.","Een KPI is een meetbare indicator, geen selectie van informatie.","Een beslissingspunt is een splitsing in een procesflow schema."],
 e:"Een filter laat bepaalde gegevens of signalen selectief door en blokkeert andere. Zo houd je alleen de relevante informatie over voor de processturing."},

{c:"proces", q:"Een ijsfabriek ziet in de weersvoorspelling dat er een hittegolf komt en verhoogt nu al de productie. Welk principe is dit?",
 o:["Vooruitkoppeling (feedforward)","Terugkoppeling (feedback)","De Check-fase","Een filter"], a:0,
 w:["","Terugkoppeling reageert achteraf op gemeten output. Hier is er nog geen probleem.","Check vergelijkt resultaten met doelen achteraf.","Een filter selecteert alleen informatie."],
 e:"Vooruitkoppeling: informatie gebruiken om toekomstige prestaties te voorspellen en maatregelen te nemen voordat problemen ontstaan. Het is proactief en helpt fouten voorkomen."},

{c:"proces", q:"Wat is het belangrijkste verschil tussen terugkoppeling en vooruitkoppeling?",
 o:["Terugkoppeling stuurt bij na het meten van de output (reactief), vooruitkoppeling grijpt vooraf in om problemen te voorkomen (proactief)","Terugkoppeling is proactief, vooruitkoppeling reactief","Er is geen verschil","Vooruitkoppeling gebruikt geen informatie"], a:0,
 w:["","Het is andersom.","Er is wel een verschil: achteraf tegenover vooraf.","Vooruitkoppeling gebruikt juist informatie om te voorspellen."],
 e:"Terugkoppeling = achteruitkijkspiegel: meten wat er gebeurd is en bijsturen. Vooruitkoppeling = weersvoorspelling: vooruitkijken en ingrijpen voor er iets misgaat."},

{c:"proces", q:"Wat is een kritieke succesfactor (KSF)?",
 o:["Een factor die cruciaal is om de doelstellingen van een organisatie of project te halen","Een getal dat je meet om prestaties te evalueren","Een fout in een proces","Een stap in de PDCA-cyclus"], a:0,
 w:["","Dat is een KPI. Een KSF is wat goed moet gaan, een KPI meet het.","Een KSF is juist iets wat goed moet gaan.","De PDCA-stappen zijn Plan, Do, Check en Act."],
 e:"Een KSF is een factor die cruciaal is voor succes. Bij processturing zijn het de belangrijkste aspecten die je moet bewaken om een proces goed te laten verlopen."},

{c:"proces", q:"Een pakketdienst zegt: 'Snelle levering is cruciaal voor ons succes.' Ze meten daarom het percentage pakketten dat binnen 24 uur aankomt. Wat is wat?",
 o:["Snelle levering is de KSF, het percentage is de KPI","Snelle levering is de KPI, het percentage is de KSF","Beide zijn KPI's","Beide zijn KSF's"], a:0,
 w:["","Het is andersom: de KPI is altijd het meetbare getal.","Snelle levering is geen getal, dus geen KPI.","Het percentage is een meetbaar getal, dus een KPI en geen KSF."],
 e:"KSF = wat moet goed gaan (het doel). KPI = hoe je meet of het goed gaat (de meetlat). Een KSF is een factor, een KPI is altijd een getal."},

{c:"proces", q:"Welke van deze noemt de stof als voorbeeld van een KPI bij processen?",
 o:["De doorlooptijd van een proces","Het organigram van het bedrijf","De strategische top","Een beslissingspunt"], a:0,
 w:["","Een organigram is een schema, geen meetwaarde.","Dat is een component van Mintzberg.","Dat is een splitsing in een procesflow schema."],
 e:"De stof noemt als voorbeelden van KPI's: doorlooptijd van een proces, klanttevredenheidsscores, efficiëntiepercentages en kostenbesparingen. Allemaal meetbaar."},

{c:"proces", q:"Wat zijn parallelle processen?",
 o:["Processen die tegelijk plaatsvinden, waarbij taken onafhankelijk van elkaar worden uitgevoerd","Processen waarbij elke stap moet wachten op de vorige","Processen die elk jaar herhaald worden","Processen die alleen door de top worden uitgevoerd"], a:0,
 w:["","Dat zijn seriële processen.","Herhaling heeft niets met parallel te maken.","Wie het uitvoert heeft niets met parallel te maken."],
 e:"Bij parallelle processen gebeuren taken tegelijk en onafhankelijk van elkaar. Dat bespaart tijd, verkort de doorlooptijd en vermindert bottlenecks."},

{c:"proces", q:"Wat is volgens de stof een belangrijk voordeel van parallelle processen?",
 o:["Tijdsbesparing en een snellere doorlooptijd, en minder bottlenecks","Strikte controle over de volgorde","Elke stap kan pas beginnen als de vorige klaar is","Ze zijn altijd goedkoper dan seriële processen"], a:0,
 w:["","Strikte volgorde en controle is juist het voordeel van seriële processen.","Dat beschrijft seriële processen.","Over goedkoper zegt de stof niets."],
 e:"Parallel werken bespaart tijd, want taken lopen tegelijk. Daardoor verminder je ook bottlenecks: plekken waar alles op één trage stap moet wachten."},

{c:"proces", q:"Wat zijn seriële processen?",
 o:["Opeenvolgende processen waarbij elke stap afhankelijk is van de vorige","Processen die tegelijk plaatsvinden","Processen die worden uitbesteed","Processen zonder beslissingspunten"], a:0,
 w:["","Dat zijn parallelle processen.","Uitbesteden heeft niets met serieel te maken.","Ook een serieel proces kan beslissingspunten hebben."],
 e:"Bij seriële processen moet elke stap klaar zijn voordat de volgende kan beginnen. Je gebruikt ze wanneer een strikte volgorde en controle nodig zijn."},

{c:"proces", q:"Bij het bouwen van een huis: welke twee taken kunnen PARALLEL gebeuren?",
 o:["De keuken bestellen en de tuin ontwerpen","Fundering leggen en daarna de muren bouwen","Muren bouwen en daarna het dak erop zetten","Leidingen aanleggen en daarna de muren dichtmaken"], a:0,
 w:["","De muren kunnen pas als de fundering er ligt: serieel.","Het dak kan pas als de muren staan: serieel.","De muren dichtmaken kan pas als de leidingen erin zitten: serieel."],
 e:"Test: moet taak B wachten op taak A? Een keuken bestellen en een tuin ontwerpen hangen niet van elkaar af, dus die kunnen tegelijk."},

{c:"proces", q:"Wanneer gebruik je volgens de stof vooral seriële processen?",
 o:["Wanneer strikte volgorde en controle nodig zijn","Wanneer je zo snel mogelijk klaar wil zijn","Wanneer taken onafhankelijk van elkaar zijn","Wanneer je bottlenecks wil verminderen"], a:0,
 w:["","Snelheid is juist het voordeel van parallelle processen.","Onafhankelijke taken kan je juist parallel uitvoeren.","Bottlenecks verminderen is een voordeel van parallel werken."],
 e:"Seriële processen gebruik je wanneer een strikte volgorde en controle nodig zijn, bijvoorbeeld als stap 2 echt niet kan zonder stap 1."},

{c:"proces", q:"Wat kenmerkt een procesgerichte bedrijfsstructuur?",
 o:["De organisatie is opgebouwd rond haar end-to-end processen, waardoor silo's worden doorbroken en samenwerking verbetert","De organisatie is opgebouwd rond verschillende productlijnen","Elke afdeling werkt volledig apart","Alle processen worden uitbesteed"], a:0,
 w:["","Dat is een productgerichte structuur.","Dat zijn juist silo's, die een procesgerichte structuur wil doorbreken.","Uitbesteden heeft niets met deze structuur te maken."],
 e:"Een procesgerichte structuur organiseert alles rond processen van begin tot eind, in plaats van rond afdelingen. Zo worden silo's (afdelingen die op zichzelf werken) doorbroken en werken mensen beter samen."},

{c:"proces", q:"Een verzekeraar zet één team op dat een schadeclaim volledig afhandelt van melding tot uitbetaling, met mensen uit verschillende afdelingen. Welke structuur is dit?",
 o:["Procesgericht","Productgericht","Een organigram","Een serieel proces"], a:0,
 w:["","Productgericht is georganiseerd rond producten, niet rond één doorlopend proces.","Een organigram is een schema, geen structuur op zich.","Serieel beschrijft de volgorde van stappen, niet de opbouw van de organisatie."],
 e:"Dit is procesgericht: georganiseerd rond een end-to-end proces (van melding tot uitbetaling), over afdelingen heen. Zo worden silo's doorbroken."},

{c:"proces", q:"Een multinational heeft aparte divisies voor shampoo, waspoeder en voeding, elk met eigen verantwoordelijkheden. Welke bedrijfsstructuur is dit?",
 o:["Productgericht","Procesgericht","Een hiërarchisch processchema","Parallel"], a:0,
 w:["","Procesgericht is georganiseerd rond processen, niet rond producten.","Dat is een schema, geen bedrijfsstructuur.","Parallel gaat over taken die tegelijk gebeuren."],
 e:"Een productgerichte structuur is georganiseerd rond specifieke producten of diensten. Elk product heeft zijn eigen verantwoordelijkheden, wat leidt tot specialisatie. Dit past bij bedrijven met diverse productlijnen."},

{c:"proces", q:"Voor welk soort organisatie is een productgerichte structuur volgens de stof geschikt?",
 o:["Organisaties met diverse productlijnen","Organisaties die silo's willen doorbreken","Organisaties met maar één product","Organisaties zonder afdelingen"], a:0,
 w:["","Silo's doorbreken is het doel van een procesgerichte structuur.","Met maar één product heeft het weinig zin om rond producten te organiseren.","Daar zegt de stof niets over."],
 e:"Een productgerichte structuur kan geschikt zijn voor organisaties met diverse productlijnen, omdat elke productlijn zijn eigen gespecialiseerde aanpak krijgt."},

{c:"proces", q:"Wat is een procesflow schema?",
 o:["Een visuele weergave van een proces met de stappen, beslissingspunten en de stroom van gegevens of materialen","Een weergave van de hiërarchie tussen afdelingen","Een overzicht van processen op verschillende niveaus","Een tabel met KPI's"], a:0,
 w:["","Dat is een organigram.","Dat is een hiërarchisch processchema.","Een tabel met KPI's lijkt eerder op een dashboard."],
 e:"Een procesflow schema (processtroomdiagram) toont stap voor stap hoe een proces verloopt, met de beslissingspunten. Je gebruikt het om processen te analyseren, te verbeteren en uit te leggen."},

{c:"proces", q:"In een schema van een webshop staat de stap 'Is de betaling gelukt?', met een pijl 'Ja' naar 'Verzenden' en een pijl 'Nee' naar 'Klant verwittigen'. Wat is deze stap?",
 o:["Een beslissingspunt","Een trigger","Een filter","Een KSF"], a:0,
 w:["","Een trigger start het proces. Deze stap zit midden in het proces.","Een filter selecteert informatie, het splitst het proces niet.","Een KSF is een factor die cruciaal is voor succes."],
 e:"Een beslissingspunt is een plek in het proces waar je op basis van een voorwaarde kiest welke stap volgt. Die beslissing kan automatisch zijn (zoals hier) of door een mens genomen worden."},

 w:["","Dat zijn de voordelen van ERP.","Dat gaat juist makkelijker met ERP, omdat alles in één systeem zit.","Bij Best of Breed heb je juist meerdere leveranciers."],
 e:"Best of Breed biedt de beste functionaliteit per taak, en flexibiliteit: je kan één programma vervangen zonder alles om te gooien."},

{c:"auto", q:"Een bedrijf wil dat alle afdelingen naadloos samenwerken in één systeem, en vindt het niet erg dat dat systeem niet in elke taak het allerbeste is. Wat past het best?",
 o:["ERP, vanwege integratie en uniformiteit","Best of Breed, vanwege functionaliteit","Best of Breed, vanwege integratie","Zelf alles bouwen, vanwege kostenbeheersing"], a:0,
 w:["","Best of Breed geeft de beste functionaliteit per taak, maar het bedrijf wil vooral alles in één systeem.","Integratie is juist een voordeel van ERP, niet van Best of Breed.","Zelf bouwen geeft juist hogere kosten voor interne ontwikkeling."],
 e:"Naadloos samenwerken in één systeem = integratie en uniformiteit = ERP."},

{c:"auto", q:"Waarom is 'gegevens eenmalig invoeren' makkelijker met ERP dan met Best of Breed?",
 o:["Omdat bij ERP alles in één geïntegreerd systeem zit, terwijl losse programma's van verschillende leveranciers niet vanzelf data delen","Omdat ERP geen gegevens opslaat","Omdat Best of Breed geen software gebruikt","Er is geen verschil"], a:0,
 w:["","ERP slaat wel gegevens op, in één geheel.","Best of Breed is juist een manier om software te kiezen.","Er is wel een verschil, door de integratie bij ERP."],
 e:"Bij ERP zit alles in één systeem, dus de data is meteen overal beschikbaar. Bij Best of Breed moet je de losse programma's aan elkaar koppelen, anders voer je data dubbel in."},

{c:"auto", q:"Wat betekent dekkingsgraad?",

{c:"auto", q:"Wat betekent een HOGE dekkingsgraad van een softwarepakket?",

{c:"auto", q:"Bij een pakketselectie vergelijkt een bedrijf drie pakketten op hoeveel van zijn eisen elk pakket ondersteunt. Welk begrip gebruikt het daarbij?",

GENS.push(
{c:"auto", gen(){
  const N=pick([20,25,40,50,80,100,200]); const pctTrue=rnd(11,19)*5; const k=Math.round(N*pctTrue/100); const pct=Math.round(k/N*100);
  const naam=pick(["een ziekenhuis","een webshop","een gemeente","een transportbedrijf","een hogeschool","een bakkerijketen"]);
  return {q:`${naam.charAt(0).toUpperCase()+naam.slice(1)} heeft ${N} eisen voor een nieuw softwarepakket. Pakket X ondersteunt er ${k}. Wat is de dekkingsgraad van pakket X?`,
   o:[pct+"%", (100-pct)+"%", k+"%", Math.round(N/k*100)+"%"], a:0,
   w:["",`Dat is het deel van de eisen dat het pakket NIET ondersteunt. De dekkingsgraad is het deel dat het wel ondersteunt.`,`Je nam het aantal ondersteunde eisen als percentage. Je moet nog delen door het totaal aantal eisen (${N}).`,`Je deelde verkeerd om (${N} ÷ ${k}). Het is ondersteunde eisen gedeeld door alle eisen.`],
   e:`Dekkingsgraad = ondersteunde eisen ÷ totaal aantal eisen = ${k} ÷ ${N} = ${pct}%. Het pakket dekt dus ${pct}% van de behoeften. Voor de rest (${100-pct}%) moet de organisatie iets bijbouwen of haar werkwijze aanpassen.`};
}}
);

GENS.push({c:"kosten", gen(){
  const k = pick(KOST); const askVar = Math.random()<0.5;
  const right = askVar ? pick(k.var) : pick(k.vast);
  const others = shuffle(askVar ? k.vast : k.var).slice(0,3);
  const welk = askVar ? "VARIABEL" : "VAST";
  return {q:`Welke van deze kosten is ${welk} voor ${k.b}?`,
   o:[right, ...others], a:0,
   w:["", ...others.map(x=> askVar ? `Nee: ${x} betaal je ook als je niets verkoopt. Die kost beweegt niet mee met de productie, dus ze is vast.` : `Nee: ${x} stijgt als er meer verkocht of gemaakt wordt, en is nul als er niets verkocht wordt. Dat is een variabele kost.`)],
   e: askVar ? `Hoe meer er verkocht wordt, hoe hoger deze kost (${right}). Wordt er niets verkocht, dan is hij nul. Dat maakt het een variabele kost. Test: betaal ik dit ook als ik niets verkoop? Nee, dus variabel.` : `Deze kost (${right}) blijft gelijk, of er nu veel of weinig verkocht wordt. Dat maakt het een vaste kost. Test: betaal ik dit ook als ik niets verkoop? Ja, dus vast.`};
}});

 {o:"een hogeschool", prim:["lesgeven aan studenten","examens afnemen","stages van studenten begeleiden"], ond:["de salarisadministratie","nieuwe docenten werven","het netwerk en de wifi beheren","de jaarrekening opstellen"]},
 {o:"een pizzeria", prim:["pizza's bakken","bestellingen bezorgen","klanten bedienen aan tafel"], ond:["de boekhouding bijhouden","nieuwe koks aannemen","het kassasysteem laten updaten","de loonstroken maken"]},
 {o:"een fietsenfabriek", prim:["frames lassen","fietsen monteren","fietsen leveren aan winkels"], ond:["sollicitatiegesprekken voeren","de computers van kantoor onderhouden","facturen betalen","trainingen voor personeel regelen"]},

 {o:"een bank", prim:["leningen verstrekken aan klanten","betalingen van klanten verwerken","klanten adviseren over sparen"], ond:["nieuwe medewerkers aannemen","de eigen salarissen uitbetalen","laptops van medewerkers onderhouden","de jaarlijkse personeelstraining organiseren"]},

 {o:"een garage", prim:["auto's repareren","onderhoudsbeurten uitvoeren","banden wisselen voor klanten"], ond:["de boekhouding","een nieuwe monteur aannemen","het computersysteem updaten","de lonen betalen"]}
];
GENS.push({c:"proces", gen(){
  const g = pick(ORGS); const askOnd = Math.random()<0.5;
  const right = askOnd ? pick(g.ond) : pick(g.prim);
  const others = shuffle(askOnd ? g.prim : g.ond).slice(0,3);
  return {q:`Welke van deze processen is een ${askOnd?"ONDERSTEUNEND":"PRIMAIR"} proces voor ${g.o}?`,
   o:[right, ...others], a:0,
   w:["", ...others.map(x=> askOnd ? `Nee: ${x} creëert rechtstreeks waarde voor de klant. Dat is een primair proces.` : `Nee: ${x} levert niets rechtstreeks aan de klant, maar ondersteunt het kernproces. Dat is een ondersteunend proces.`)],
   e: askOnd ? `De klant merkt ${right} niet rechtstreeks, maar het is wel nodig om het primaire proces te laten draaien. De stof noemt HR, financiële administratie en IT-ondersteuning als voorbeelden van ondersteunende processen.` : `${right.charAt(0).toUpperCase()+right.slice(1)} creëert rechtstreeks waarde voor de klant. Dat is het kernproces, volgens de stof 'het kloppende hart' van de organisatie.`};
}});

const BBN = {t:"trigger", i:"input", a:"activiteit", o:"output"};
const BBD = {t:"De trigger is de aanleiding die het proces start.", i:"De input is wat het proces binnenkomt om verwerkt te worden: materialen, gegevens, informatie.", a:"Een activiteit is een handeling die de input omzet in output.", o:"De output is het resultaat van het proces."};
GENS.push({c:"proces", gen(){
  const s = pick(BB); const ask = pick(["t","i","a","o"]); const keys = shuffle(["t","i","a","o"].filter(k=>k!==ask));
  return {q:`${s.s} Wat is in het Black-box model de ${BBN[ask].toUpperCase()}?`,
   o:[s[ask], ...keys.map(k=>s[k])], a:0,
   w:["", ...keys.map(k=>`Nee, dat is de ${BBN[k]}. ${BBD[k]}`)],
   e:`${BBD[ask]} In dit voorbeeld is dat: ${s[ask]}. Ezelsbrug: de trigger zet het proces in gang, de input wordt verwerkt, de activiteit is wat er gedaan wordt, de output is wat eruit komt.`};
}});

// Serieel of parallel
const SP = [
 {x:"het organiseren van een bruiloft", ser:[["de zaal boeken","de tafelschikking in die zaal maken"],["de uitnodigingen drukken","de gedrukte uitnodigingen versturen"],["de taart bestellen","de taart aansnijden"]], par:[["de fotograaf boeken","de bloemen bestellen"],["de muziek kiezen","de trouwringen uitzoeken"],["de kleding uitzoeken","het vervoer regelen"]]},
 {x:"het bouwen van een huis", ser:[["de fundering leggen","de muren bouwen"],["de muren bouwen","het dak plaatsen"],["de leidingen in de muur leggen","de muur dichtpleisteren"]], par:[["de keuken uitkiezen","de tuin ontwerpen"],["de badkamertegels bestellen","de verlichting uitkiezen"],["de deurklinken uitkiezen","de vloerbedekking uitkiezen"]]},
 {x:"het koken van een maaltijd", ser:[["de aardappelen schillen","de geschilde aardappelen koken"],["het deeg kneden","het deeg bakken"],["het vlees marineren","het gemarineerde vlees bakken"]], par:[["de soep opwarmen","de salade maken"],["de pasta koken","de saus maken"],["de tafel dekken","het dessert klaarzetten"]]},
 {x:"het lanceren van een website", ser:[["de teksten schrijven","de geschreven teksten controleren"],["de website bouwen","de gebouwde website testen"],["de website testen","de geteste website online zetten"]], par:[["het logo ontwerpen","de hostingprovider kiezen"],["de foto's laten maken","de privacyverklaring laten opstellen"],["de domeinnaam registreren","de teksten voor de homepage schrijven"]]},
 {x:"het organiseren van een festival", ser:[["het podium bouwen","het geluid op het podium testen"],["de tickets verkopen","de tickets aan de ingang scannen"],["de hekken plaatsen","de veiligheidsinspectie van de hekken"]], par:[["de artiesten boeken","de drankleveranciers contracteren"],["de affiches ontwerpen","de toiletten huren"],["de EHBO-post regelen","de foodtrucks uitnodigen"]]}
];
GENS.push({c:"proces", gen(){
  const s = pick(SP); const askPar = Math.random()<0.5;
  const right = askPar ? pick(s.par) : pick(s.ser);
  const others = shuffle(askPar ? s.ser : s.par).slice(0,3);
  const f = p => `${p[0]} en ${p[1]}`;
  const opts = [f(right), ...others.map(f)];
  return {q:`Bij ${s.x}: welke twee taken kunnen ${askPar?"PARALLEL (tegelijk)":"alleen SERIEEL (na elkaar)"} uitgevoerd worden?`,
   o:opts, a:0,
   w:["", ...others.map(p=> askPar ? `Nee: de tweede taak (${p[1]}) kan pas als de eerste (${p[0]}) klaar is. Ze hangen van elkaar af, dus ze zijn serieel.` : `Nee: deze twee taken (${p[0]}, ${p[1]}) hangen niet van elkaar af. Ze kunnen tegelijk, dus parallel.`)],
   e: askPar ? `Deze twee taken (${right[0]}, ${right[1]}) hangen niet van elkaar af, dus ze kunnen tegelijk. Parallelle processen besparen tijd en verminderen bottlenecks. Test: moet taak B wachten op taak A? Nee, dan parallel.` : `De tweede taak (${right[1]}) kan pas beginnen als de eerste (${right[0]}) klaar is. Elke stap hangt af van de vorige: dat is serieel. Je gebruikt dat als een strikte volgorde nodig is.`};
}});

// Data-object of attribuut
const DO = [
 {o:"klant", attr:["naam","adres","telefoonnummer","e-mailadres","geboortedatum"]},
 {o:"product", attr:["prijs","gewicht","kleur","productnummer","omschrijving"]},
 {o:"bestelling", attr:["besteldatum","totaalbedrag","bestelnummer","leveradres","betaalstatus"]},
 {o:"medewerker", attr:["functie","salaris","personeelsnummer","datum in dienst","afdeling"]},
 {o:"auto", attr:["kenteken","merk","kilometerstand","bouwjaar","kleur"]},
 {o:"boek", attr:["titel","auteur","aantal pagina's","ISBN-nummer","uitgavejaar"]},
 {o:"patiënt", attr:["patiëntnummer","naam","geboortedatum","huisarts","bloedgroep"]},
 {o:"factuur", attr:["factuurnummer","factuurdatum","bedrag","vervaldatum","btw-bedrag"]}
];
GENS.push({c:"auto", gen(){
  const mode = Math.random()<0.5 ? "attr" : "obj";
  if(mode==="attr"){
    const d = pick(DO); const right = pick(d.attr);
    const REL = {bestelling:["klant","product"], factuur:["klant","bestelling"], patiënt:[], klant:["bestelling","factuur"], product:["bestelling"]};
    const others = shuffle(DO.filter(x=>x!==d && !(REL[d.o]||[]).includes(x.o))).slice(0,3).map(x=>x.o);
    return {q:`In een database staat het data-object '${d.o}'. Welke van deze is een ATTRIBUUT van dat data-object?`,
     o:[right, ...others], a:0,
     w:["", ...others.map(x=>`Nee: een ${x} is zelf een data-object, een ding waarover je gegevens opslaat. Het is geen eigenschap van een ${d.o}.`)],
     e:`Een attribuut is een kenmerk of eigenschap van een data-object. Test: kan je zeggen 'de ${right} van de ${d.o}'? Ja, dus ${right} is een attribuut van het data-object ${d.o}.`};
  } else {
    const d = pick(DO); const atts = shuffle(DO.filter(x=>x!==d)).slice(0,3).map(x=>pick(x.attr));
    return {q:`Welke van deze is een DATA-OBJECT (en geen attribuut)?`,
     o:[d.o, ...atts], a:0,
     w:["", ...atts.map(x=>`Nee: ${x} is een eigenschap van iets, dus een attribuut. Een data-object is het ding zelf, zoals een klant of een product.`)],
     e:`Een data-object is een entiteit in een database, zoals een klantrecord, een productbeschrijving of een bestelling. Een ${d.o} is zo'n ding, met attributen zoals ${d.attr.slice(0,3).join(", ")}.`};
  }
}});

function applyFixes(){

    if(!q){ console.warn("Fix niet gevonden:", f.start); continue; }
    q.o = f.o.slice(); q.a = 0; q.w = ["", ...f.w]; if(f.q) q.q = f.q;

  for(const q of BANK){ if(q.cls) continue; for(const [a,b] of TEXTFIX) q.q = q.q.replace(a,b); }
}

<p class="tip">Ezelsbrug voor de volgorde: voor wie, wat, langs waar, welke band, welk geld, wat nodig, wat doen, met wie, wat kost het.</p>

<h3>1. Customer Segments</h3>
<p>De groepen mensen of organisaties die een bedrijf wil bereiken en bedienen. Klanten zijn <b>het hart</b> van elk businessmodel: zonder (winstgevende) klanten overleeft geen bedrijf. Een bedrijf groepeert klanten op <b>gemeenschappelijke behoeften, gedrag of andere kenmerken</b>, en moet <b>bewust kiezen</b> welke segmenten het bedient en welke het negeert. Een model kan één of meerdere, grote of kleine segmenten hebben.</p>
<p><b>Groepen zijn aparte segmenten als:</b></p>
<ul><li>hun behoeften een <b>ander aanbod</b> vragen</li><li>ze via <b>andere kanalen</b> bereikt worden</li><li>ze een <b>ander soort relatie</b> vragen</li><li>ze <b>duidelijk andere winstgevendheid</b> hebben</li><li>ze willen betalen voor <b>andere aspecten</b> van het aanbod</li></ul>

<h3>2. Value Propositions</h3>
<p>De <b>bundel producten en diensten</b> die waarde creëert voor een specifiek segment. Het is <b>de reden waarom klanten voor het ene bedrijf kiezen en niet voor een ander</b>: ze lost een probleem op of vervult een behoefte. Een Value Proposition kan <b>innovatief</b> zijn (nieuw of disruptief) of <b>vergelijkbaar met bestaand aanbod maar met extra kenmerken</b>.</p>

<p>Hoe een bedrijf <b>communiceert met klanten en hen bereikt</b> om de Value Proposition te leveren. Communicatie-, distributie- en verkoopkanalen vormen samen de <b>interface</b> met de klant. Het zijn <b>contactpunten (touch points)</b> die de klantbeleving sterk bepalen.</p>

<h3>4. Customer Relationships</h3>
<p>De soorten relaties die een bedrijf aangaat met elk segment, van <b>persoonlijk</b> tot <b>geautomatiseerd</b>. De relatie bepaalt sterk de totale klantbeleving.</p>
<p><b>Drie motivaties:</b> klantenwerving (acquisition), klantenbinding (retention) en meer verkopen (upselling). Voorbeeld: mobiele operatoren gaven eerst gratis gsm's weg om klanten te werven, en schakelden toen de markt verzadigd was over op klanten houden en meer omzet per klant.</p>
<div class="tbl"><table>
<tr><th>Soort relatie</th><th>Wat</th><th>Voorbeeld</th></tr>
<tr><td>Personal assistance</td><td>Contact met een medewerker, in de winkel, via callcenter of e-mail</td><td>Verkoper in de winkel</td></tr>
<tr><td>Dedicated personal assistance</td><td>Eén vaste medewerker per klant. De diepste relatie</td><td>Private banker, key account manager</td></tr>
<tr><td>Self-service</td><td>Geen direct contact. De klant krijgt de middelen om zichzelf te helpen</td><td>Zelfscankassa</td></tr>
<tr><td>Automated services</td><td>Slimme self-service die de klant herkent</td><td>Boek- of filmaanbevelingen</td></tr>
<tr><td>Communities</td><td>Klanten helpen elkaar en delen kennis</td><td>GlaxoSmithKline (afslankmiddel alli)</td></tr>
<tr><td>Co-creation</td><td>Samen met de klant waarde maken</td><td>Amazon-reviews, YouTube-video's</td></tr>
</table></div>
<p class="tip"><b>Channels</b> = langs waar bereik je de klant. <b>Customer Relationships</b> = wat voor band heb je ermee. After sales is een kanaalfase, geen relatiemotivatie.</p>

<h3>5 tot 9. De andere bouwblokken</h3>
<ul>
<li><b>Revenue Streams:</b> inkomsten doordat Value Propositions met succes aan klanten worden aangeboden.</li>
<li><b>Key Resources:</b> de middelen (assets) die nodig zijn om alles aan te bieden en te leveren.</li>
<li><b>Key Activities:</b> de belangrijkste activiteiten die het bedrijf uitvoert.</li>
<li><b>Key Partnerships:</b> sommige activiteiten worden uitbesteed, sommige middelen komen van buiten.</li>
<li><b>Cost Structure:</b> volgt uit alle elementen van het businessmodel samen.</li>
</ul>
<p class="tip">Resources heb je, activities doe je.</p>

bi: `

<tr><th>Begrip</th><th>Betekenis</th><th>Let op</th></tr>
<tr><td>Business Intelligence (BI)</td><td>Het proces van gegevens verzamelen, analyseren en rapporteren om beslissingen te nemen op basis van feiten</td><td>BI is het <b>proces</b></td></tr>
<tr><td>Power BI</td><td>BI-tool van Microsoft om data te visualiseren, analyseren en delen</td><td>Power BI is de <b>tool</b></td></tr>
<tr><td>Dashboard</td><td>Visuele weergave van de belangrijkste KPI's (grafieken, tabellen, kaarten)</td><td>Snel overzicht van status en trends</td></tr>
<tr><td>Rapport</td><td>Gestructureerd, gedetailleerd document met data en analyses</td><td>Om te delen en beslissingen te onderbouwen</td></tr>
<tr><td>Gegevensmodel</td><td>Voorstelling van de databronnen en hun onderlinge relaties</td><td>De plattegrond van je data</td></tr>
<tr><td>Query</td><td>Verzoek om data op te halen, te wijzigen of te combineren uit bronnen</td><td>Voorbereiden <b>vóór</b> analyse</td></tr>
<tr><td>DAX</td><td>Formuletaal in Power BI voor eigen berekeningen en aggregaties op het model</td><td>Rekenen <b>in</b> het model. Aggregatie = veel waarden samenvatten tot één getal</td></tr>
<tr><td>ETL</td><td>Extract (ophalen), Transform (omvormen en opkuisen), Load (laden in een datawarehouse)</td><td>Halen, poetsen, wegzetten</td></tr>
<tr><td>KPI</td><td>Meetbare indicator die toont of de organisatie haar strategische doelen haalt</td><td>Niet elk getal is een KPI: het hangt aan een doel</td></tr>
<tr><td>Stermodel</td><td>Centrale feitentabel, via sleutels verbonden met dimensietabellen</td><td>Maakt rapportage eenvoudig en efficiënt</td></tr>

<h3>Hoe de data stroomt</h3>

kosten: `
<p class="intro">Dit hoofdstuk gaat over kosten, opbrengsten en de financiële documenten. Er komen rekenvragen in, dus ken de formules.</p>
<div class="tbl"><table>
<tr><th>Begrip</th><th>Betekenis</th></tr>
<tr><td>Break-evenpunt</td><td>De verkoop- of productieomvang waarbij er geen winst en geen verlies is</td></tr>
<tr><td>Totale variabele kosten</td><td>Stijgen als er meer geproduceerd wordt, dalen als er minder geproduceerd wordt</td></tr>
<tr><td>Totale vaste kosten</td><td>Veranderen niet als er meer of minder geproduceerd wordt</td></tr>
<tr><td>Verdienmodel</td><td>Hoe je geld verdient met je bedrijf</td></tr>
<tr><td>Contributiemarge</td><td>Hoeveel 1 verkocht stuk bijdraagt aan de vaste kosten en winst, nadat de variabele kosten gedekt zijn</td></tr>
<tr><td>Balans</td><td>Financiële positie op <b>één moment</b>: activa, passiva en eigen vermogen</td></tr>
<tr><td>Winst- en verliesrekening</td><td>Alle opbrengsten en kosten over een <b>periode</b>, met het nettoresultaat. Ook resultatenrekening</td></tr>
<tr><td>Kasstroomoverzicht</td><td>Inkomsten, uitgaven en veranderingen in liquide middelen (cash en bank) over een periode</td></tr>
<tr><td>Budget</td><td>Plan met de <b>verwachte</b> inkomsten en uitgaven, meestal per jaar en per kwartaal. Voor een individu, gezin of organisatie</td></tr>
</table></div>
<h3>Vast of variabel?</h3>
<p>Test: <b>betaal ik dit ook als ik niets verkoop?</b> Ja = vast (huur, verzekering, vast loon). Nee = variabel (grondstoffen, verpakking, verzending per pakket). Vast betekent niet 'verandert nooit', maar 'beweegt niet mee met de productie'.</p>
<h3>Verdienmodellen</h3>
<div class="tbl"><table>
<tr><th>Model</th><th>Hoe</th><th>Voorbeelden</th></tr>
<tr><td>Abonnementsmodel</td><td>Klanten betalen periodiek, toegang hangt af van het abonnement</td><td>Netflix, Adobe Creative Cloud, The New York Times</td></tr>
<tr><td>Reclamemodel</td><td>Gratis voor gebruikers, inkomsten uit advertenties</td><td>Google, Facebook</td></tr>
</table></div>
<h3>De formules</h3>
<div class="formula">Contributiemarge = verkoopprijs per stuk − variabele kosten per stuk</div>
<div class="formula">Break-evenpunt = vaste kosten ÷ contributiemarge</div>
<div class="formula">Resultaat = (contributiemarge × aantal) − vaste kosten</div>
<div class="formula">Eigen vermogen = activa − passiva</div>
<p><b>Voorbeeld:</b> prijs €3, variabele kosten €1, vaste kosten €2.000. Contributiemarge = €2. Break-evenpunt = €2.000 ÷ €2 = 1.000 stuks. Bij 1.500 stuks: 1.500 × €2 − €2.000 = €1.000 winst.</p>
<p class="tip">Omgekeerd rekenen: contributiemarge = vaste kosten ÷ break-evenpunt. Verkoopprijs = contributiemarge + variabele kosten.</p>
<h3>Wat verandert het break-evenpunt?</h3>
<ul><li>Vaste kosten omhoog of prijs omlaag of variabele kosten omhoog → break-evenpunt <b>stijgt</b></li><li>Vaste kosten omlaag of prijs omhoog of variabele kosten omlaag → break-evenpunt <b>daalt</b></li><li>Meer of minder verkopen verandert het break-evenpunt <b>niet</b>, alleen je winst</li></ul>
<h3>De vier documenten</h3>
<div class="tbl"><table>
<tr><th></th><th>Balans</th><th>Winst- en verliesrekening</th><th>Kasstroomoverzicht</th><th>Budget</th></tr>
<tr><td>Tijd</td><td>Moment</td><td>Periode</td><td>Periode</td><td>Toekomst</td></tr>
<tr><td>Beeld</td><td>Foto</td><td>Film</td><td>Film van je portemonnee</td><td>Plan</td></tr>
<tr><td>Vraag</td><td>Wat bezit ik, wat ben ik schuldig?</td><td>Maak ik winst?</td><td>Heb ik genoeg geld?</td><td>Wat verwacht ik?</td></tr>
</table></div>
<p class="tip">Winst is geen cash. Een bedrijf kan winst maken en toch zijn rekeningen niet kunnen betalen, bijvoorbeeld als klanten pas later betalen. Dat zie je in het kasstroomoverzicht.</p>

proces: `
<h3>Basisbegrippen bedrijfsprocessen</h3>
<p>Een <b>bedrijfsproces</b> bestaat uit <b>input</b> (wat erin gaat: gegevens, materialen, aanvragen, bestellingen), <b>activiteiten</b> (de stappen die de input omzetten) en <b>output</b> (het resultaat: product, dienst, rapport of beslissing).</p>
<div class="tbl"><table>
<tr><th></th><th>Primair proces</th><th>Ondersteunend proces</th></tr>
<tr><td>Wat</td><td>Kernproces, 'het kloppende hart'. Draagt direct bij aan de hoofddoelen</td><td>Niet direct voor de klant, wel nodig voor de primaire processen</td></tr>
<tr><td>Voorbeelden</td><td>Patiënten behandelen, lesgeven, auto's repareren</td><td>HR-beheer, financiële administratie, IT-ondersteuning</td></tr>
</table></div>
<p class="tip">Test: creëert het rechtstreeks waarde voor de klant? Ja = primair.</p>
<h3>Mintzberg: vijf componenten</h3>
<div class="tbl"><table>
<tr><th>Component</th><th>Wat doen ze?</th><th>Voorbeelden</th></tr>
<tr><td>Strategische top</td><td>Strategische doelen en richting bepalen, grote beslissingen nemen</td><td>Directie, CEO</td></tr>
<tr><td>Middenlijn</td><td>Strategie vertalen naar operationele plannen, coördineren</td><td>Filiaalmanagers, afdelingshoofden</td></tr>
<tr><td>Operationele kern</td><td>Het dagelijkse werk dat waarde creëert voor de klant. 'Het hart'</td><td>Koks, verpleegkundigen, monteurs</td></tr>
<tr><td>Technische staf</td><td>Specialistische kennis en advies</td><td>Ingenieurs, IT-specialisten, juridische adviseurs</td></tr>
<tr><td>Ondersteunende staf</td><td>Diensten zodat alles soepel loopt, niet in de kern</td><td>HR, financiën, administratie, facilitair management</td></tr>
</table></div>
<p class="tip">Technische staf geeft <b>advies</b>, ondersteunende staf levert <b>diensten</b>.</p>
<p><b>Organigram:</b> visuele weergave van de structuur: de hiërarchie en relaties tussen afdelingen, functies en medewerkers. Wie is de baas van wie.</p>
<p><b>Black-box model:</b> het proces is een gesloten doos. Je kijkt naar <b>triggers</b> (aanleiding), <b>input</b> (bronnen), <b>activiteiten</b> (handelingen) en <b>output</b> (resultaten). De focus ligt op de omzetting van input naar output.</p>
<p class="tip">Trigger = wat het proces start (het telefoontje). Input = wat verwerkt wordt (het onderdeel).</p>

<h3>Processturing en prestatiemeting</h3>
<p><b>Processturing:</b> een proces bewust beïnvloeden door te plannen, monitoren en aanpassen. Kan <b>reactief</b> of <b>proactief</b> zijn.</p>
<p><b>Terugkoppeling (feedback)</b> in 5 stappen: (1) input gaat erin, (2) proces in de black box, (3) output komt eruit, (4) output meten en analyseren, (5) actie: bijsturen als de output niet voldoet. Reactief.</p>
<div class="tbl"><table>
<tr><th>PDCA</th><th>Wat gebeurt er</th><th>Rol van terugkoppeling</th></tr>
<tr><td>Plan</td><td>Doelen, middelen, verantwoordelijkheden, procedures</td><td>Data uit het verleden gebruiken</td></tr>
<tr><td>Do</td><td>Het plan uitvoeren</td><td>Uitvoering volgen, afwijkingen vastleggen</td></tr>
<tr><td>Check</td><td>Resultaten vergelijken met de doelen</td><td>Data en KPI's analyseren</td></tr>
<tr><td>Act</td><td>Corrigerende acties nemen</td><td>Basis voor de beslissing</td></tr>
</table></div>
<p><b>Filter:</b> laat relevante informatie door en blokkeert de rest.</p>
<p><b>Vooruitkoppeling (feedforward):</b> informatie gebruiken om de toekomst te voorspellen en in te grijpen <b>voordat</b> problemen ontstaan. Proactief, voorkomt fouten.</p>
<div class="tbl"><table>
<tr><th></th><th>Terugkoppeling</th><th>Vooruitkoppeling</th></tr>
<tr><td>Wanneer</td><td>Na het proces</td><td>Voor het proces</td></tr>
<tr><td>Houding</td><td>Reactief: fouten corrigeren</td><td>Proactief: fouten voorkomen</td></tr>
<tr><td>Voorbeeld</td><td>Klachten van vorige maand lezen en bijsturen</td><td>Hittegolf voorspeld, nu al meer ijs maken</td></tr>
</table></div>
<p><b>KSF (kritieke succesfactor):</b> een factor die cruciaal is om de doelen te halen. <b>KPI:</b> een meetbare indicator om prestaties te evalueren, zoals doorlooptijd, klanttevredenheidsscore, efficiëntiepercentage of kostenbesparing.</p>
<p class="tip">De KSF is het doel ('snelle levering'), de KPI is de meetlat ('% binnen 24 uur geleverd').</p>

<h3>Het inrichten van processen</h3>
<div class="tbl"><table>
<tr><th>Begrip</th><th>Betekenis</th></tr>
<tr><td>Parallelle processen</td><td>Taken gebeuren tegelijk en onafhankelijk. Tijdwinst, minder bottlenecks</td></tr>
<tr><td>Seriële processen</td><td>Elke stap hangt af van de vorige. Voor strikte volgorde en controle</td></tr>
<tr><td>Procesgerichte structuur</td><td>Organiseren rond end-to-end processen. Doorbreekt silo's, bevordert samenwerking</td></tr>
<tr><td>Productgerichte structuur</td><td>Organiseren rond producten of diensten, met eigen verantwoordelijkheden. Specialisatie, past bij diverse productlijnen</td></tr>
<tr><td>Procesflow schema</td><td>De stappen, beslissingspunten en stroom van gegevens of materialen van een proces</td></tr>
<tr><td>Beslissingspunt</td><td>Punt waar op basis van een voorwaarde gekozen wordt. Automatisch of door een mens</td></tr>
<tr><td>Hiërarchisch processchema</td><td>Hoe processen op niveaus samenhangen, van strategisch tot operationeel</td></tr>
</table></div>
<p class="tip">Test serieel of parallel: moet taak B wachten op taak A? Ja = serieel.</p>
<p class="tip">Organigram = mensen. Procesflow schema = stappen van één proces. Hiërarchisch processchema = alle processen in niveaus.</p>
`,

<h3>De IT-basis en data</h3>
<div class="tbl"><table>
<tr><th>Begrip</th><th>Betekenis</th></tr>

<p class="tip">Data-object of attribuut? Zeg 'de ___ van de ___'. 'De kleur van de auto': kleur = attribuut, auto = data-object.</p>
<p><b>Gegevensstructuur:</b> tabel = het hele blok, record = één rij, veld = één kolom, sleutel = uniek nummer om een record terug te vinden en tabellen te koppelen.</p>

<h3>Soorten bedrijfssoftware</h3>
<div class="tbl"><table>

<h3>Keuzes maken in software</h3>

<p><b>Dekkingsgraad:</b> de mate waarin een pakket de behoeften en eisen ondersteunt. Formule: ondersteunde eisen ÷ totaal aantal eisen. 45 van 50 eisen = 90%.</p>
<p><b>Pakketselectie:</b> de methode om een softwarepakket te kiezen: leveranciers en producten evalueren en een weloverwogen keuze maken. De dekkingsgraad is daarbij een hulpmiddel.</p>

  for(let t=0;t<40;t++){
    const r = g.gen();
    if(new Set(r.o).size===4){ r.c=g.c; r.id="g"; r.o=r.o.map(x=>x.charAt(0).toUpperCase()+x.slice(1)); return materialize(r); }
  }
  return null;
}
function pickStatic(c, n){
  const seen = new Set(store.get("bk-seen", []));
  const pool = BANK.filter(q=>q.c===c);
  let fresh = shuffle(pool.filter(q=>!seen.has(q.id)));
  if(fresh.length < n){
    // alles van dit hoofdstuk al gezien: begin opnieuw
    const ids = new Set(pool.map(q=>q.id));
    store.set("bk-seen", [...seen].filter(id=>!ids.has(id)));
    fresh = fresh.concat(shuffle(pool.filter(q=>!fresh.includes(q))));
  }
  return fresh.slice(0, n);
}
function buildExam(mode, chapter){
  let qs = [];
  const plan = mode==="full" ? ORDER.map(c=>[c, CH[c].n]) : [[chapter, 20]];
  for(const [c, n] of plan){
    const gens = shuffle(GENS.filter(g=>g.c===c));
    let nGen = mode==="full" ? (CH[c].gen||0) : (CH[c].gen20||0);
    const part = [];
    for(let i=0;i<nGen && gens.length;i++){ const g = gens[i % gens.length]; const q = fromGen(g); if(q && !part.some(p=>p.q===q.q)) part.push(q); }
    part.push(...pickStatic(c, n - part.length).map(materialize));
    qs.push(...part);
  }
  qs = mode==="full" ? shuffle(qs) : shuffle(qs);
  const seen = new Set(store.get("bk-seen", []));
  qs.forEach(q=>{ if(q.id!=="g") seen.add(q.id); });
  store.set("bk-seen", [...seen]);
  return qs;
}
function grade(p){
  const g = p >= 0.7 ? 5.5 + (p-0.7)/0.3*4.5 : 1 + p/0.7*4.5;
  return Math.round(g*10)/10;
}
const fmtGrade = g => g.toFixed(1).replace(".", ",");

let S = window.claude?.hot?.data?.S || store.get("bk-current", null) || { view:"start", mode:"full", chapter:"bmc" };
let showAll = false;
function save(){ store.set("bk-current", S.view==="exam" ? S : null); }
window.claude?.hot?.snapshot?.(()=>({S}));

const app = document.getElementById("app");
function render(){
  if(S.view==="exam") return renderExam();
  if(S.view==="result") return renderResult();
  if(S.view==="summary") return renderSummary();
  renderStart();
}

function renderStart(){
  const hist = store.get("bk-history", []);
  const total = BANK.length;
  app.innerHTML = `
  <header class="top">
    <div class="eyebrow">Bedrijfskunde · oefententamen</div>
    <h1>Tentamentrainer Bedrijfskunde</h1>
    <p class="lead">Elke toets haalt nieuwe vragen uit alle 5 bijlages. Rekenvragen krijgen elke keer andere getallen. Op het einde zie je je cijfer, en bij elke fout <span class="mark">waarom</span> je antwoord niet klopt.</p>
  </header>
  <div class="facts">
    <div class="fact"><b>40</b><span>vragen per toets</span></div>
    <div class="fact"><b>70%</b><span>goed = een 5,5</span></div>
    <div class="fact"><b>${Math.floor(total/50)*50}+</b><span>vragen, plus rekenvragen</span></div>
  </div>
  <div class="panel stack">
    <h2 style="margin:0">Kies je toets</h2>
    <div class="modes" role="radiogroup">
      <button class="mode" id="m-full" aria-pressed="${S.mode==="full"}" role="radio" aria-checked="${S.mode==="full"}"><span class="dot"></span><span><strong>Volledig tentamen</strong><small>40 vragen over alle 5 hoofdstukken, verdeeld zoals op het echte tentamen.</small></span></button>
      <button class="mode" id="m-ch" aria-pressed="${S.mode==="chapter"}" role="radio" aria-checked="${S.mode==="chapter"}"><span class="dot"></span><span><strong>Eén hoofdstuk oefenen</strong><small>20 vragen over één onderwerp, om een zwak punt bij te werken.</small></span></button>
    </div>
    <div ${S.mode==="chapter"?"":"hidden"}>
      <div class="tag">Hoofdstuk</div>
      <div class="chapters">${ORDER.map(c=>`<button class="chip" data-ch="${c}" aria-pressed="${S.chapter===c}">${CH[c].naam}</button>`).join("")}</div>
    </div>
    <button class="btn wide" id="go">Start ${S.mode==="full" ? "tentamen (40 vragen)" : "oefening (20 vragen)"}</button>
  </div>
  <section class="panel stack"><h2 style="margin:0">Samenvatting</h2><p style="margin:0" class="lead">Alle stof uit de 5 bijlages op een rij, in de volgorde van je bijlages. Met de valkuilen en formules erbij.</p><button class="btn ghost wide" id="sum">Samenvatting lezen</button></section>
  ${hist.length ? `<section class="history"><h2>Je laatste toetsen</h2><ol>${hist.slice(0,6).map(h=>`<li><span>${esc(h.d)} · ${esc(h.label)}</span><span><b>${fmtGrade(h.g)}</b> · ${h.p}%</span></li>`).join("")}</ol></section>` : ""}
  `;
  app.querySelector("#m-full").onclick = ()=>{ S.mode="full"; render(); };
  app.querySelector("#m-ch").onclick = ()=>{ S.mode="chapter"; render(); };
  app.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{ S.chapter=b.dataset.ch; render(); });
  app.querySelector("#go").onclick = start;
  app.querySelector("#sum").onclick = ()=>openSummary(S.mode==="chapter"?S.chapter:"bmc");
}

function start(){
  const qs = buildExam(S.mode, S.chapter);
  S = { view:"exam", mode:S.mode, chapter:S.chapter, qs, ans:Array(qs.length).fill(null), i:0, confirm:false };
  save(); render(); window.scrollTo(0,0);
}

function renderExam(){
  const q = S.qs[S.i], n = S.qs.length, done = S.ans.filter(a=>a!==null).length;
  app.innerHTML = `
  <div class="bar"><div class="bar-inner">
    <div class="progress"><div class="label"><span>Vraag ${S.i+1} van ${n}</span><span>${done} beantwoord</span></div><div class="track"><i style="width:${done/n*100}%"></i></div></div>
    <button class="btn small" id="submit">Inleveren</button>
  </div></div>
  ${S.confirm ? `<div class="panel confirm stack" style="margin-top:12px">
     <strong>${n-done===0 ? "Alles beantwoord. Inleveren?" : `Je hebt nog ${n-done} ${n-done===1?"vraag":"vragen"} open. Die tellen als fout.`}</strong>
     <div class="actions"><button class="btn" id="yes">Ja, inleveren</button><button class="btn ghost" id="no">Verder maken</button></div>
   </div>` : ""}
  <article class="panel qcard">
    <div><span class="qnum">${S.i+1}.</span> <span class="tag">${CH[q.c].naam}</span></div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts" role="radiogroup">
      ${q.o.map((o,k)=>`<button class="opt" role="radio" data-k="${k}" aria-checked="${S.ans[S.i]===k}"><span class="letter">${LETTERS[k]}</span><span>${esc(o)}</span></button>`).join("")}
    </div>
    <div class="nav">
      <button class="btn ghost" id="prev" ${S.i===0?"disabled":""}>← Vorige</button>
      ${S.i===n-1 ? `<button class="btn" id="end">Inleveren</button>` : `<button class="btn" id="next">Volgende →</button>`}
    </div>
  </article>
  <div class="grid" aria-label="Overzicht van alle vragen">
    ${S.qs.map((_,k)=>`<button class="cell ${S.ans[k]!==null?"done":""} ${k===S.i?"here":""}" data-go="${k}" aria-label="Vraag ${k+1}">${k+1}</button>`).join("")}
  </div>
  <p class="hint">Tip: toets A tot D (of 1 tot 4) om te antwoorden, en pijltjes om te bladeren. Je ziet de antwoorden pas na het inleveren, net als op het echte tentamen.</p>
  `;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
  const pr=app.querySelector("#prev"), nx=app.querySelector("#next"), en=app.querySelector("#end");
  if(pr) pr.onclick=()=>go(S.i-1);
  if(nx) nx.onclick=()=>go(S.i+1);
  if(en) en.onclick=askSubmit;
  app.querySelector("#submit").onclick=askSubmit;
  const y=app.querySelector("#yes"), no=app.querySelector("#no");
  if(y) y.onclick=finish;
  if(no) no.onclick=()=>{ S.confirm=false; render(); };
}
function answer(k){ S.ans[S.i]=k; save(); render(); }
function go(i){ if(i<0||i>=S.qs.length) return; S.i=i; S.confirm=false; save(); render(); }
function askSubmit(){ S.confirm=true; render(); window.scrollTo({top:0, behavior:"smooth"}); }
function finish(){
  const n=S.qs.length, right=S.qs.filter((q,k)=>S.ans[k]===q.a).length, p=right/n, g=grade(p);
  const label = S.mode==="full" ? "Volledig tentamen" : CH[S.chapter].naam;
  const hist = store.get("bk-history", []);
  hist.unshift({ d:new Date().toLocaleDateString("nl-NL",{day:"numeric",month:"short"}), label, g, p:Math.round(p*100) });
  store.set("bk-history", hist.slice(0,20));
  S.view="result"; S.right=right; showAll=false; store.set("bk-current", null); render(); window.scrollTo(0,0);
}

function renderResult(){
  const n=S.qs.length, right=S.right, p=right/n, g=grade(p), pass=g>=5.5;
  const pct=Math.round(p*100), need=Math.ceil(n*0.7);
  const per = ORDER.filter(c=>S.qs.some(q=>q.c===c)).map(c=>{
    const ks = S.qs.map((q,k)=>k).filter(k=>S.qs[k].c===c);
    const r = ks.filter(k=>S.ans[k]===S.qs[k].a).length;
    return {c, r, t:ks.length};
  });
  const weakest = per.filter(x=>x.t>0).sort((a,b)=>a.r/a.t-b.r/b.t)[0];
  const items = S.qs.map((q,k)=>({q,k,ok:S.ans[k]===q.a})).filter(x=>showAll || !x.ok);
  const wrongCount = n-right;
  app.innerHTML = `
  <header class="top"><div class="eyebrow">Uitslag · ${S.mode==="full"?"volledig tentamen":esc(CH[S.chapter].naam)}</div></header>
  <section class="panel">
    <div class="result-head">
      <div class="grade ${pass?"":"fail"}"><div><small>cijfer</small><b>${fmtGrade(g)}</b></div></div>
      <div>
        <h2 class="verdict" style="margin:0">${pass ? (g>=8 ? "Ruim geslaagd. Sterk werk." : "Geslaagd.") : "Nog niet geslaagd."}</h2>
        <div class="stats"><span><b>${right}</b> van ${n} goed</span><span><b>${pct}%</b> goed</span><span>Nodig voor een 5,5: <b>${need}</b> goed</span></div>
        <p class="scale">${pass ? (wrongCount ? `Lees hieronder je ${wrongCount} ${wrongCount===1?"fout":"fouten"} door. Daar zit je volgende punt.` : "Foutloos. Doe er nog één om te bewijzen dat het geen geluk was.") : `Je mist er nog ${need-right}. Begin bij ${esc(CH[weakest.c].naam)}, daar viel het meest weg.`}</p>
      </div>
    </div>
  </section>
  <section>
    <h2>Per hoofdstuk</h2>
    <div class="panel chbars">
      ${per.map(x=>{ const r=x.r/x.t; const col = r>=0.7?"var(--good)":"var(--bad)"; return `<div class="chrow"><span>${CH[x.c].naam} <button class="linkbtn" data-sum="${x.c}">samenvatting</button></span><span class="num">${x.r}/${x.t} · ${Math.round(r*100)}%</span><div class="t"><i style="width:${r*100}%; background:${col}"></i></div></div>`; }).join("")}
    </div>
  </section>
  <section>
    <h2>${showAll ? "Alle vragen" : wrongCount ? `Je fouten, met uitleg (${wrongCount})` : "Geen fouten"}</h2>
    <div class="filters" style="margin-bottom:14px">
      <button class="chip" id="f-wrong" aria-pressed="${!showAll}">Alleen fouten</button>
      <button class="chip" id="f-all" aria-pressed="${showAll}">Alle vragen</button>
    </div>
    <div class="review">
      ${items.map(({q,k,ok})=>{
        const y=S.ans[k];
        return `<article class="rv ${ok?"ok":""}">
          <div><span class="qnum">${k+1}.</span> <span class="tag">${CH[q.c].naam}</span></div>
          <p class="qtext">${esc(q.q)}</p>
          ${ok ? `<div class="ans right"><span class="lbl">Jouw antwoord, goed</span>${LETTERS[q.a]}. ${esc(q.o[q.a])}</div>`
               : `<div class="ans your"><span class="lbl">${y===null?"Niet beantwoord":"Jouw antwoord"}</span>${y===null?"Je liet deze vraag open.":LETTERS[y]+". "+esc(q.o[y])}</div>
                  <div class="ans right"><span class="lbl">Juiste antwoord</span>${LETTERS[q.a]}. ${esc(q.o[q.a])}</div>`}
          <div class="explain">
            ${!ok && y!==null && q.w[y] ? `<h4>Waarom jouw antwoord niet klopt</h4><p>${esc(q.w[y])}</p>` : ""}
            <h4>${ok?"Uitleg":"Zo zit het wel"}</h4><p>${esc(q.e)}</p>
          </div>
        </article>`; }).join("")}
    </div>
  </section>
  <section class="actions">
    <button class="btn" id="again">Nieuwe toets</button>
    <button class="btn ghost" id="home">Naar start</button>
  </section>
  `;
  app.querySelector("#f-wrong").onclick=()=>{ showAll=false; render(); };
  app.querySelector("#f-all").onclick=()=>{ showAll=true; render(); };
  app.querySelector("#again").onclick=start;
  app.querySelectorAll("[data-sum]").forEach(b=>b.onclick=()=>openSummary(b.dataset.sum));
  app.querySelector("#home").onclick=()=>{ S={view:"start", mode:S.mode, chapter:S.chapter}; render(); window.scrollTo(0,0); };
}

let backTo = null;
function openSummary(c){ backTo = {view:S.view}; S.prev = S.view==="summary" ? S.prev : JSON.parse(JSON.stringify(S)); S.view="summary"; S.sumCh=c; render(); window.scrollTo(0,0); }
function renderSummary(){
  const c = S.sumCh || "bmc";
  app.innerHTML = `
  <header class="top"><div class="eyebrow">Samenvatting · ${ORDER.indexOf(c)+1} van 5</div><h1 style="font-size:clamp(26px,5vw,36px)">${CH[c].naam}</h1></header>
  <nav class="sumnav">${ORDER.map(k=>`<button class="chip" data-ch="${k}" aria-pressed="${k===c}">${CH[k].naam}</button>`).join("")}</nav>
  <article class="sum">${SUMMARY[c]}</article>
  <section class="actions">
    ${ORDER.indexOf(c)<4 ? `<button class="btn" id="nextch">Volgende: ${CH[ORDER[ORDER.indexOf(c)+1]].naam} →</button>` : ""}
    <button class="btn ghost" id="practice">20 vragen over dit hoofdstuk</button>
    <button class="btn ghost" id="back">Terug</button>
  </section>`;
  app.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{ S.sumCh=b.dataset.ch; render(); window.scrollTo(0,0); });
  const n=app.querySelector("#nextch"); if(n) n.onclick=()=>{ S.sumCh=ORDER[ORDER.indexOf(c)+1]; render(); window.scrollTo(0,0); };
  app.querySelector("#practice").onclick=()=>{ S={view:"start", mode:"chapter", chapter:c}; start(); };
  app.querySelector("#back").onclick=()=>{ const p=S.prev; S = p && p.view!=="summary" ? p : {view:"start", mode:"full", chapter:"bmc"}; if(S.view==="result") showAll=false; render(); window.scrollTo(0,0); };
}

document.addEventListener("keydown", e=>{
  if(S.view!=="exam" || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const map = {a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3};
  if(k in map){ answer(map[k]); }
  else if(e.key==="ArrowRight"){ go(S.i+1); }
  else if(e.key==="ArrowLeft"){ go(S.i-1); }
});

render();
</script>

</body>
</html>
