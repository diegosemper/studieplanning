<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tentamentrainer Bedrijfskunde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: één smalle kolom als een tentamenblad, met een plakkende voortgangsbalk; markeerstift-geel als enige accent naast inktblauw */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F6F8FB; --line:#D7DDE7;
  --ink:#142033; --muted:#5A6577; --brand:#2340B8; --brand-ink:#FFFFFF;
  --mark:#FFE45C; --mark-ink:#142033;
  --good:#1E7A4C; --good-bg:#E3F4EA; --bad:#B42318; --bad-bg:#FCE8E6;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --shadow:0 1px 2px rgba(20,32,51,.06), 0 6px 20px rgba(20,32,51,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1420; --surface:#162032; --surface-2:#1B2840; --line:#2B3A55;
  --ink:#E6EBF4; --muted:#9AA6BA; --brand:#8FA8FF; --brand-ink:#0E1420;
  --mark:#E8CF4A; --mark-ink:#0E1420;
  --good:#5CCB8F; --good-bg:#14301F; --bad:#FF8A7E; --bad-bg:#3A1A18;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#162032; --surface-2:#1B2840; --line:#2B3A55;
  --ink:#E6EBF4; --muted:#9AA6BA; --brand:#8FA8FF; --brand-ink:#0E1420;
  --mark:#E8CF4A; --mark-ink:#0E1420;
  --good:#5CCB8F; --good-bg:#14301F; --bad:#FF8A7E; --bad-bg:#3A1A18;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0 48px}
.wrap{max-width:760px; margin:0 auto}
h1,h2,h3{font-family:var(--display); line-height:1.15; text-wrap:balance; margin:0}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, .opt:focus-visible{outline:3px solid var(--brand); outline-offset:2px}
.mark{background:linear-gradient(transparent 55%, var(--mark) 55%); padding:0 2px; color:inherit}

/* Start */
header.top{padding-block:28px 8px}
.eyebrow{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700}
h1{font-size:clamp(30px, 6vw, 44px); font-weight:800; margin-top:6px}
.lead{color:var(--muted); max-width:60ch; margin:10px 0 0}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:var(--shadow)}
.stack{display:grid; gap:16px}
.facts{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; margin:22px 0}
.fact{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px}
.fact b{display:block; font-family:var(--display); font-size:26px; font-variant-numeric:tabular-nums}
.fact span{font-size:14px; color:var(--muted)}
.modes{display:grid; gap:10px}
.mode{display:flex; gap:12px; align-items:flex-start; text-align:left; background:var(--surface-2); border:2px solid var(--line); border-radius:12px; padding:14px}
.mode[aria-pressed="true"]{border-color:var(--brand); background:var(--surface)}
.mode .dot{flex:none; width:20px; height:20px; border-radius:50%; border:2px solid var(--muted); margin-top:2px}
.mode[aria-pressed="true"] .dot{border-color:var(--brand); box-shadow:inset 0 0 0 4px var(--surface), inset 0 0 0 10px var(--brand)}
.mode strong{display:block}
.mode small{color:var(--muted); font-size:15px}
.chapters{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.chip{border:1.5px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 12px; font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.btn{border:0; border-radius:12px; padding:14px 22px; font-weight:700; font-size:17px; background:var(--brand); color:var(--brand-ink)}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45; cursor:not-allowed}
.history{font-size:15px; color:var(--muted)}
.history ol{list-style:none; padding:0; margin:8px 0 0; display:grid; gap:6px}
.history li{display:flex; justify-content:space-between; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-variant-numeric:tabular-nums}
.history li b{color:var(--ink)}

/* Toets */
.bar{position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--bg); padding-block:12px 10px; margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)))}
.bar-inner{max-width:760px; margin:0 auto; padding-inline:max(16px, env(safe-area-inset-left, 0px)); display:flex; align-items:center; gap:12px}
.progress{flex:1; min-width:0}
.progress .label{font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; display:flex; justify-content:space-between}
.track{height:8px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:6px}
.track i{display:block; height:100%; background:var(--brand); width:0; transition:width .25s}
.btn.small{padding:10px 14px; font-size:15px}
.qcard{margin-top:12px}
.tag{display:inline-block; font-size:13px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted)}
.qnum{font-family:var(--display); font-weight:800; font-size:15px; color:var(--brand)}
.qtext{font-size:clamp(19px, 3.6vw, 22px); font-weight:700; margin:8px 0 18px; line-height:1.4}
.opts{display:grid; gap:10px}
.opt{display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%; background:var(--surface-2); border:2px solid var(--line); border-radius:12px; padding:13px 14px; font-size:17px}
.opt:hover{border-color:var(--muted)}
.opt .letter{flex:none; width:30px; height:30px; display:grid; place-items:center; border-radius:8px; background:var(--surface); border:1.5px solid var(--line); font-weight:700; font-family:var(--display)}
.opt[aria-checked="true"]{border-color:var(--brand); background:var(--surface)}
.opt[aria-checked="true"] .letter{background:var(--brand); border-color:var(--brand); color:var(--brand-ink)}
.opt span:last-child{min-width:0; padding-top:2px}
.nav{display:flex; justify-content:space-between; gap:10px; margin-top:18px}
.grid{display:grid; grid-template-columns:repeat(10, minmax(0,1fr)); gap:6px; margin-top:22px}
.cell{aspect-ratio:1; max-width:100%; border-radius:8px; border:1.5px solid var(--line); background:var(--surface); font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; padding:0}
.cell.done{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.cell.here{outline:3px solid var(--mark); outline-offset:1px}
.hint{font-size:14px; color:var(--muted); margin-top:12px}
.confirm{border:2px solid var(--mark); background:var(--surface)}

/* Resultaat */
.result-head{display:grid; grid-template-columns:auto 1fr; gap:22px; align-items:center}
.grade{width:132px; height:132px; border-radius:50%; display:grid; place-items:center; text-align:center; border:6px solid var(--good); background:var(--good-bg)}
.grade.fail{border-color:var(--bad); background:var(--bad-bg)}
.grade b{font-family:var(--display); font-size:46px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums}
.grade small{display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.verdict{font-size:22px}
.stats{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:8px; color:var(--muted); font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.scale{margin-top:10px; font-size:14px; color:var(--muted)}
.chbars{display:grid; gap:12px}
.chrow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; font-size:15px}
.chrow .t{height:10px; grid-column:1 / -1; border-radius:99px; background:var(--line); overflow:hidden}
.chrow .t i{display:block; height:100%}
.chrow .num{font-variant-numeric:tabular-nums; color:var(--muted)}
.filters{display:flex; flex-wrap:wrap; gap:8px}
.review{display:grid; gap:14px}
.rv{background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--bad); border-radius:12px; padding:16px}
.rv.ok{border-left-color:var(--good)}
.rv .qtext{font-size:18px; margin:6px 0 12px}
.ans{border-radius:10px; padding:10px 12px; margin-top:8px; font-size:16px}
.ans.your{background:var(--bad-bg)}
.ans.right{background:var(--good-bg)}
.ans .lbl{display:block; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-bottom:2px}
.ans.your .lbl{color:var(--bad)} .ans.right .lbl{color:var(--good)}
.explain{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line)}
.explain h4{font-family:var(--display); font-size:15px; margin:0 0 4px}
.explain p{margin:0 0 10px; max-width:68ch}
.actions{display:flex; flex-wrap:wrap; gap:10px}
section + section{margin-top:22px}
h2{font-size:24px; font-weight:800; margin-bottom:12px}
/* Samenvatting */
.sum{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:var(--shadow)}
.sum h3{font-size:20px; font-weight:800; margin:26px 0 8px}
.sum h3:first-child{margin-top:0}
.sum p, .sum li{max-width:68ch}
.sum ul, .sum ol{padding-left:22px}
.sum li{margin:3px 0}
.sum .intro{font-size:18px}
.sum .tip{background:var(--surface-2); border-left:4px solid var(--mark); border-radius:6px; padding:8px 12px; font-size:16px}
.sum .formula{font-family:var(--display); font-weight:700; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:8px 0; font-variant-numeric:tabular-nums}
.sum .flow{font-weight:700}
.tbl{overflow-x:auto; margin:10px 0}
.tbl table{border-collapse:collapse; width:100%; font-size:15px; min-width:480px}
.tbl th, .tbl td{text-align:left; vertical-align:top; padding:8px 10px; border-bottom:1px solid var(--line)}
.tbl th{font-family:var(--display); background:var(--surface-2)}
.sumnav{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0}
.linkbtn{background:none; border:0; padding:0; color:var(--brand); font-weight:700; text-decoration:underline; font-size:14px}
@media (max-width:560px){
  body{font-size:16px}
  .facts{grid-template-columns:1fr 1fr 1fr; gap:8px}
  .fact{padding:10px} .fact b{font-size:21px} .fact span{font-size:13px}
  .grid{grid-template-columns:repeat(8, minmax(0,1fr))}
  .result-head{grid-template-columns:1fr; justify-items:start}
  .grade{width:112px; height:112px} .grade b{font-size:38px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<div class="wrap"><a href="../#leerstof/bk" style="display:inline-block;margin-top:16px;font-size:15px;font-weight:700;color:var(--brand);text-decoration:none">← Terug naar studieplanning</a></div>
<div class="wrap" id="app"></div>

<script>
const BANK = []; const GENS = [];
function addCls(def){ def.items.forEach(it=>BANK.push({c:def.c, cls:def, it})); }
// Hoofdstuk: Business Model Canvas (bijlage 'begrippen 1')
BANK.push(
{c:"bmc", q:"Wat beschrijft het bouwblok Customer Segments?",
 o:["De verschillende groepen mensen of organisaties die een bedrijf wil bereiken en bedienen","De manieren waarop een bedrijf zijn klanten bereikt","Het pakket producten en diensten dat waarde creëert","Het soort relatie dat een bedrijf met zijn klanten heeft"], a:0,
 w:["","Dat is Channels (blok 3): langs welke weg je de klant bereikt.","Dat is de Value Proposition (blok 2): wat je de klant aanbiedt.","Dat is Customer Relationships (blok 4): wat voor band je met de klant hebt."],
 e:"Customer Segments (blok 1) gaat over de vraag 'voor wie maken we waarde?'. Het zijn de groepen mensen of organisaties die een bedrijf wil bereiken en bedienen. Je begint altijd hier, want zonder klanten is er geen bedrijf."},

{c:"bmc", q:"Waarom noemt het boek klanten 'het hart' van elk businessmodel?",
 o:["Omdat geen bedrijf lang overleeft zonder (winstgevende) klanten","Omdat klanten de goedkoopste bron van inkomsten zijn","Omdat klanten altijd de Key Partners van een bedrijf zijn","Omdat klanten de kostenstructuur bepalen"], a:0,
 w:["","Over 'goedkoop' zegt de stof niets. Het gaat erom dat je zonder klanten niet overleeft.","Key Partners zijn partners, zoals leveranciers. Dat zijn geen klanten.","De kostenstructuur volgt uit alle andere blokken, niet alleen uit de klanten."],
 e:"Het boek zegt letterlijk: zonder (winstgevende) klanten kan geen bedrijf lang overleven. Daarom staan klanten centraal en begin je het canvas bij Customer Segments."},

{c:"bmc", q:"Wat moet een organisatie volgens de stof doen met haar klantsegmenten?",
 o:["Een bewuste keuze maken welke segmenten ze bedient en welke ze negeert","Zoveel mogelijk segmenten bedienen om risico te spreiden","Altijd precies één segment kiezen","De segmenten pas kiezen nadat het businessmodel af is"], a:0,
 w:["","Het boek zegt juist dat je bewust moet kiezen, ook wat je negeert. Iedereen bedienen staat er niet.","Een businessmodel kan één of meerdere segmenten hebben, dus 'altijd één' klopt niet.","Het is andersom: eerst kies je de segmenten, dan ontwerp je het model rond hun behoeften."],
 e:"Een organisatie moet bewust beslissen welke segmenten ze bedient en welke ze negeert. Pas daarna kan het businessmodel zorgvuldig rond de behoeften van die klanten ontworpen worden."},

{c:"bmc", q:"Welke van deze is GEEN criterium om klantgroepen als aparte segmenten te zien?",
 o:["Ze wonen in verschillende provincies","Hun behoeften vragen om een ander aanbod","Ze worden bereikt via andere distributiekanalen","Ze willen betalen voor andere aspecten van het aanbod"], a:0,
 w:["","Dit is wel een criterium: een ander aanbod nodig hebben.","Dit is wel een criterium: andere kanalen.","Dit is wel een criterium: voor andere dingen willen betalen."],
 e:"De 5 criteria zijn: (1) ander aanbod nodig, (2) andere kanalen, (3) ander soort relatie, (4) duidelijk andere winstgevendheid, (5) bereid te betalen voor andere aspecten. Waar iemand woont staat niet in die lijst."},

{c:"bmc", q:"Welke combinatie bevat ALLEEN criteria uit de stof voor aparte klantsegmenten?",
 o:["Ander soort relatie nodig, en duidelijk andere winstgevendheid","Andere leeftijd, en ander geslacht","Ander soort relatie nodig, en andere hobby's","Andere winstgevendheid, en andere nationaliteit"], a:0,
 w:["","Leeftijd en geslacht staan niet in de lijst van 5 criteria.","Hobby's staan niet in de lijst. De relatie wel.","Nationaliteit staat niet in de lijst. Winstgevendheid wel."],
 e:"Onthoud de 5 criteria als: een groep krijgt iets anders, wordt anders bereikt, wordt anders behandeld (relatie), brengt anders op (winstgevendheid) of betaalt voor iets anders. Persoonskenmerken zoals leeftijd staan er niet bij."},

{c:"bmc", q:"Een bedrijf richt zich op één grote groep klanten met ongeveer dezelfde behoeften. Aanbod, kanalen en relaties zijn voor iedereen hetzelfde. Welk type klantsegment is dit?",
 o:["Mass market","Niche market","Segmented","Multi-sided platform"], a:0,
 w:["","Een niche market richt zich juist op een specifieke, gespecialiseerde groep.","Segmented betekent dat je onderscheid maakt tussen groepen met licht verschillende behoeften.","Een multi-sided platform bedient twee of meer groepen die van elkaar afhankelijk zijn."],
 e:"Bij een mass market maak je geen onderscheid tussen klantgroepen. Alles is gericht op één grote groep met grotendeels dezelfde behoeften. Het boek noemt de consumentenelektronica als voorbeeld."},

{c:"bmc", q:"In welke sector komt een mass market-businessmodel volgens het boek vaak voor?",
 o:["Consumentenelektronica","Private banking","Auto-onderdelen voor grote autofabrikanten","Vliegtuigmotoren"], a:0,
 w:["","Private banking werkt met zeer persoonlijke relaties met rijke klanten. Dat is geen massamarkt.","Auto-onderdelenmakers zijn het voorbeeld van een niche market.","Vliegtuigmotoren (Rolls-Royce) is het voorbeeld van 'getting the job done', geen massamarkt."],
 e:"Het boek noemt de consumentenelektronica als typische sector voor een mass market: één grote groep klanten met ongeveer dezelfde behoeften."},

{c:"bmc", q:"Een fabrikant van auto-onderdelen verkoopt bijna alles aan een paar grote autofabrikanten. Aanbod, kanalen en relatie zijn volledig op hen afgestemd. Welk type klantsegment is dit?",
 o:["Niche market","Mass market","Diversified","Segmented"], a:0,
 w:["","Bij een mass market bedien je één grote algemene groep, geen paar specifieke afnemers.","Diversified betekent twee segmenten die niets met elkaar te maken hebben.","Segmented betekent groepen met licht verschillende behoeften binnen één markt."],
 e:"Een niche market bedient een specifiek, gespecialiseerd segment. Alles is afgestemd op hun eisen. Het boek noemt precies dit voorbeeld: auto-onderdelenmakers die afhankelijk zijn van grote autofabrikanten, vaak in een leverancier-afnemerrelatie."},

{c:"bmc", q:"Een bank maakt onderscheid tussen een grote groep klanten met een vermogen tot $100.000 en een kleinere groep met meer dan $500.000. De behoeften lijken op elkaar maar verschillen wel. Welk type is dit?",
 o:["Segmented","Mass market","Diversified","Niche market"], a:0,
 w:["","Bij een mass market maak je juist geen onderscheid tussen groepen.","Diversified gaat over twee groepen die niets met elkaar te maken hebben. Hier lijken de behoeften juist op elkaar.","Een niche market is één specifieke gespecialiseerde groep, geen opsplitsing van je klanten."],
 e:"Segmented betekent: onderscheid maken tussen segmenten met licht verschillende behoeften en problemen. Het boek gebruikt Credit Suisse als voorbeeld. Die opsplitsing heeft gevolgen voor de andere blokken, zoals Value Proposition, kanalen en relaties."},

{c:"bmc", q:"Micro Precision Systems bedient de horloge-industrie, de medische sector en de industriële automatisering, met telkens een licht ander aanbod. Welk type klantsegment is dit volgens het boek?",
 o:["Segmented","Mass market","Multi-sided platform","Niche market"], a:0,
 w:["","Bij een mass market is er één aanbod voor één grote groep.","Bij een multi-sided platform hebben de groepen elkaar nodig. Deze drie sectoren zijn niet van elkaar afhankelijk.","Een niche market is één specifieke groep. Hier zijn het er drie met licht verschillende aanbiedingen."],
 e:"Het boek noemt Micro Precision Systems als voorbeeld van 'segmented': drie segmenten met licht verschillende Value Propositions."},

{c:"bmc", q:"In 2006 begon Amazon.com naast zijn webwinkel ook cloud computing (opslag en serverruimte) te verkopen aan webbedrijven. Welk type klantsegment beschrijft dit?",
 o:["Diversified","Segmented","Mass market","Niche market"], a:0,
 w:["","Segmented gaat over groepen met licht verschillende behoeften. Webwinkelklanten en webbedrijven hebben totaal andere behoeften.","Een mass market is één grote groep met dezelfde behoeften.","Een niche market is één gespecialiseerde groep, geen uitbreiding naar een totaal andere markt."],
 e:"Diversified betekent: twee segmenten bedienen die niets met elkaar te maken hebben, met heel verschillende behoeften. Amazon kon dit doen omdat het zijn sterke IT-infrastructuur kon delen tussen de webwinkel en de cloudtak."},

{c:"bmc", q:"Een creditcardbedrijf heeft veel kaarthouders nodig én veel winkels die de kaart accepteren. Beide groepen zijn nodig om het model te laten werken. Welk type klantsegment is dit?",
 o:["Multi-sided platform","Diversified","Segmented","Mass market"], a:0,
 w:["","Bij diversified zijn de segmenten juist niet van elkaar afhankelijk.","Segmented gaat over groepen met licht verschillende behoeften, niet over groepen die elkaar nodig hebben.","Een mass market is één grote groep, hier zijn het er twee."],
 e:"Een multi-sided platform bedient twee of meer segmenten die van elkaar afhankelijk zijn. Zonder winkels heeft de kaarthouder niets aan zijn kaart, en zonder kaarthouders willen winkels de kaart niet accepteren."},

{c:"bmc", q:"Een gratis krant heeft veel lezers nodig om adverteerders te trekken, en adverteerders om de krant te betalen. Wat voor businessmodel is dit?",
 o:["Een multi-sided platform","Een niche market","Een diversified model","Een mass market"], a:0,
 w:["","Een niche market richt zich op één gespecialiseerde groep, niet op twee groepen die elkaar nodig hebben.","Bij diversified hebben de twee segmenten niets met elkaar te maken. Hier hebben ze elkaar juist nodig.","Een mass market heeft één grote groep klanten, geen twee afhankelijke groepen."],
 e:"Dit is het voorbeeld uit het boek van een multi-sided platform: lezers en adverteerders zijn allebei nodig. Zonder lezers geen adverteerders, en zonder adverteerders geen geld om de krant te maken."},

{c:"bmc", q:"Wat is volgens het boek de Value Proposition?",
 o:["Het pakket (de bundel) producten en diensten dat waarde creëert voor een specifiek klantsegment","Alle kosten die een bedrijf maakt om een product te leveren","De prijs die een klant betaalt","De kanalen waarlangs een bedrijf zijn klanten bereikt"], a:0,
 w:["","Kosten horen bij de Cost Structure (blok 9).","De prijs hoort bij Revenue Streams (blok 5). Een lage prijs kan wel deel zijn van een VP, maar de VP is veel breder.","Kanalen zijn blok 3, Channels."],
 e:"De Value Proposition is de bundel producten en diensten die waarde creëert voor een specifiek klantsegment. Het is een optelsom van voordelen die het bedrijf de klant biedt."},

{c:"bmc", q:"Wat is volgens het boek de belangrijkste functie van een Value Proposition?",
 o:["Het is de reden waarom klanten voor het ene bedrijf kiezen en niet voor een ander","Het bepaalt welke partners een bedrijf heeft","Het toont hoeveel winst een bedrijf maakt","Het beschrijft hoe de organisatie intern is opgebouwd"], a:0,
 w:["","Partners horen bij Key Partnerships, blok 8.","Winst volgt uit opbrengsten min kosten. Dat zegt de VP niet.","De interne opbouw staat niet in de VP. De VP kijkt naar de klant."],
 e:"De Value Proposition is de reden waarom klanten naar het ene bedrijf gaan en niet naar het andere. Ze lost een probleem van de klant op of vervult een behoefte."},

{c:"bmc", q:"Welke twee soorten Value Propositions onderscheidt het boek?",
 o:["Innovatieve (nieuw of disruptief) en vergelijkbaar met bestaand aanbod maar met extra kenmerken","Dure en goedkope","Fysieke en digitale","Tijdelijke en permanente"], a:0,
 w:["","Duur en goedkoop is geen indeling uit de stof.","Fysiek en digitaal staat niet in de stof als indeling.","Tijdelijk en permanent staat niet in de stof."],
 e:"Sommige Value Propositions zijn innovatief en vormen een nieuw of disruptief aanbod. Andere lijken op wat er al op de markt is, maar met extra kenmerken en eigenschappen."},

{c:"bmc", q:"Waarden in een Value Proposition kunnen kwantitatief of kwalitatief zijn. Welke van deze is KWALITATIEF?",
 o:["De klantbeleving (customer experience)","De prijs","De snelheid van de service","Het aantal producten in een pakket"], a:0,
 w:["","Prijs is een getal en dus kwantitatief. Het boek noemt het als voorbeeld van kwantitatief.","Snelheid kan je meten en is dus kwantitatief. Het boek noemt het als voorbeeld van kwantitatief.","Een aantal is een getal en dus kwantitatief."],
 e:"Kwantitatief = je kan het in een getal uitdrukken (prijs, snelheid van service). Kwalitatief = je kan het niet zomaar meten (design, klantbeleving)."},

{c:"bmc", q:"Een Value Proposition voldoet aan een volledig nieuwe set behoeften die klanten eerder niet zagen, omdat er nog niets vergelijkbaars bestond. Welk element is dit?",
 o:["Newness","Performance","Customization","Convenience/usability"], a:0,
 w:["","Performance gaat over een bestaand product beter maken, niet over iets totaal nieuws.","Customization gaat over aanpassen aan een specifieke klant.","Convenience gaat over iets makkelijker maken in gebruik."],
 e:"Newness: je vervult behoeften die klanten eerst niet eens zagen, omdat er niets vergelijkbaars was. Het boek noemt de gsm, die een hele nieuwe industrie creëerde."},

{c:"bmc", q:"Klopt het dat 'Newness' volgens het boek altijd met technologie te maken heeft?",
 o:["Nee, vaak wel maar niet altijd. Ethische beleggingsfondsen zijn nieuw maar hebben weinig met technologie te maken","Ja, nieuwheid gaat altijd over nieuwe technologie","Ja, het boek noemt alleen de gsm als voorbeeld","Nee, newness heeft nooit met technologie te maken"], a:0,
 w:["","Het boek zegt letterlijk 'vaak, maar niet altijd' technologiegerelateerd.","Het boek geeft ook een niet-technologisch voorbeeld: ethische beleggingsfondsen.","De gsm is juist een technologisch voorbeeld van newness, dus 'nooit' klopt niet."],
 e:"Newness is vaak, maar niet altijd, technologisch. De gsm creëerde een nieuwe industrie (wel technologie). Ethische beleggingsfondsen zijn nieuw maar hebben weinig met technologie te maken."},

{c:"bmc", q:"De pc-sector bracht steeds krachtigere computers op de markt om waarde te creëren. Welk element van de Value Proposition is dit, en wat zegt het boek over de grenzen ervan?",
 o:["Performance. Snellere pc's leverden de laatste jaren niet meer evenveel extra vraag op","Newness. Elke snellere pc is een volledig nieuw product","Design. Klanten kopen pc's vooral om het uiterlijk","Performance. Dit werkt altijd en heeft geen grenzen"], a:0,
 w:["","Een snellere pc vervult geen totaal nieuwe behoefte. Hij doet hetzelfde, alleen beter.","Het gaat hier om kracht en snelheid, niet om het uiterlijk.","Het boek zegt juist dat performance grenzen heeft."],
 e:"Performance = de prestaties van een product of dienst verbeteren. Het boek waarschuwt: dit heeft grenzen. Snellere pc's, meer opslag en betere graphics leverden niet meer evenveel groei in vraag op."},

{c:"bmc", q:"Een sportmerk laat klanten online hun eigen schoen samenstellen met eigen kleuren en hun naam erop, terwijl het toch op grote schaal produceert. Welk element van de Value Proposition is dit?",
 o:["Customization","Newness","Brand/status","Cost reduction"], a:0,
 w:["","Gepersonaliseerde schoenen vervullen geen totaal nieuwe behoefte.","Het gaat hier om aanpassen aan de klant, niet om het tonen van een merk.","Er wordt niets goedkoper voor de klant."],
 e:"Customization: producten afstemmen op individuele klanten of segmenten. Het boek noemt 'mass customization' en 'customer co-creation': maatwerk, terwijl je toch de voordelen van grootschalige productie houdt."},

{c:"bmc", q:"Luchtvaartmaatschappijen laten Rolls-Royce hun motoren bouwen én onderhouden en betalen per uur dat een motor draait. Welk element van de Value Proposition is dit?",
 o:["Getting the job done","Price","Risk reduction","Accessibility"], a:0,
 w:["","Het gaat er niet om dat het goedkoper is, maar dat Rolls-Royce een hele taak overneemt.","Risico verlagen kan een bijeffect zijn, maar het boek gebruikt dit voorbeeld voor 'getting the job done'.","Accessibility betekent iets beschikbaar maken voor klanten die er eerst geen toegang toe hadden."],
 e:"Getting the job done: je helpt de klant door een taak volledig over te nemen. Luchtvaartmaatschappijen kunnen zich zo focussen op vliegen, terwijl Rolls-Royce voor de motoren zorgt."},

{c:"bmc", q:"Welke uitspraak over 'Design' als Value Proposition-element klopt volgens het boek?",
 o:["Het is belangrijk maar moeilijk te meten, vooral in mode en consumentenelektronica","Het is makkelijk te meten in euro's","Het speelt alleen een rol bij luxe horloges","Het is hetzelfde als brand/status"], a:0,
 w:["","Het boek zegt juist dat design moeilijk te meten is.","Het boek noemt mode en consumentenelektronica, niet alleen horloges. Het Rolex-voorbeeld hoort bij brand/status.","Brand/status gaat over waarde halen uit het tonen van een merk. Design gaat over het ontwerp zelf."],
 e:"Design is een belangrijk maar moeilijk te meten element. Een product kan opvallen door een superieur ontwerp. In mode en consumentenelektronica is design vaak een groot deel van de Value Proposition."},

{c:"bmc", q:"Iemand draagt een Rolex om te tonen dat hij rijk is. Welk element van de Value Proposition is dit?",
 o:["Brand/status","Design","Performance","Price"], a:0,
 w:["","Design gaat over het ontwerp zelf. Hier gaat het om wat het merk over de drager zegt.","Performance gaat over beter presteren. Hij draagt hem niet omdat hij beter de tijd aangeeft.","Een Rolex is juist duur, dus Price als VP-element klopt niet."],
 e:"Brand/status: klanten halen waarde uit het gebruiken en tonen van een merk. Een Rolex staat voor rijkdom. Aan de andere kant dragen skaters 'underground' merken om te tonen dat ze erbij horen."},

{c:"bmc", q:"Skaters dragen de nieuwste 'underground' merken om te tonen dat ze 'in' zijn. Welk element van de Value Proposition is dit?",
 o:["Brand/status","Price","Newness","Customization"], a:0,
 w:["","Het gaat niet om een lage prijs, maar om wat het merk uitstraalt.","Newness gaat over een totaal nieuwe behoefte vervullen, niet over een merk tonen.","Customization gaat over aanpassen aan de klant."],
 e:"Ook dit is brand/status, maar aan de andere kant van het spectrum dan de Rolex. Het merk tonen geeft waarde: je laat zien dat je bij de groep hoort."},

{c:"bmc", q:"Wat zegt het boek over een Value Proposition gebaseerd op een lage prijs?",
 o:["Ze heeft belangrijke gevolgen voor de rest van het businessmodel","Ze werkt alleen voor luxeproducten","Ze heeft geen invloed op de kosten","Ze kan alleen bij gratis producten"], a:0,
 w:["","Lage prijs is juist bedoeld voor prijsgevoelige klanten, niet voor luxe.","Het is net andersom: een lage prijs dwingt je om je kosten laag te houden.","Gratis is een extreme vorm van prijs, maar lage prijs kan ook zonder gratis te zijn."],
 e:"Een lage prijs heeft grote gevolgen voor het hele businessmodel. Ryanair, easyJet en Southwest ontwierpen hun volledige businessmodel om goedkoop vliegen mogelijk te maken."},

{c:"bmc", q:"De Tata Nano was een auto met een verrassend lage prijs, waardoor een heel nieuw deel van de Indiase bevolking een auto kon kopen. Welk element van de Value Proposition is dit?",
 o:["Price","Design","Performance","Brand/status"], a:0,
 w:["","De auto werd niet gekocht om het ontwerp, maar om de lage prijs.","De auto presteerde niet beter dan andere auto's.","Een goedkope auto draag je niet om status te tonen."],
 e:"Price: vergelijkbare waarde bieden voor een lagere prijs, voor prijsgevoelige klanten. Het boek noemt de Tata Nano. Ook gratis aanbod (gratis kranten, gratis e-mail) valt onder dit element."},

{c:"bmc", q:"Salesforce.com biedt een CRM-programma online aan, zodat klanten zelf geen CRM-software moeten kopen, installeren en beheren. Welk element van de Value Proposition is dit volgens het boek?",
 o:["Cost reduction","Newness","Brand/status","Design"], a:0,
 w:["","CRM-software bestond al. Het nieuwe zit in het besparen van kosten en gedoe.","Klanten kiezen Salesforce niet om een merk te tonen.","Het gaat niet om het uiterlijk van de software."],
 e:"Cost reduction: klanten helpen kosten te verlagen. Salesforce bespaart klanten de kosten en de moeite van zelf software kopen, installeren en beheren."},

{c:"bmc", q:"Een tweedehandsautoverkoper geeft een jaar garantie, zodat de koper niet bang hoeft te zijn voor dure pannes. Welk element van de Value Proposition is dit?",
 o:["Risk reduction","Cost reduction","Accessibility","Getting the job done"], a:0,
 w:["","De auto wordt niet goedkoper. Het risico op onverwachte kosten wordt kleiner.","Accessibility is iets bereikbaar maken voor mensen die er eerst geen toegang toe hadden.","De verkoper neemt geen taak van de klant over. Hij verlaagt het risico."],
 e:"Risk reduction: klanten waarderen het als het risico van een aankoop kleiner wordt. Het boek noemt precies dit voorbeeld: een jaar garantie bij een tweedehandsauto."},

{c:"bmc", q:"NetJets maakte het mogelijk om een deel van een privéjet te bezitten, waardoor mensen die zich geen eigen jet konden veroorloven er toch gebruik van konden maken. Welk element van de Value Proposition is dit?",
 o:["Accessibility","Brand/status","Performance","Customization"], a:0,
 w:["","Status kan meespelen, maar het boek gebruikt NetJets als voorbeeld van toegankelijkheid.","De jet zelf presteert niet beter.","Het product wordt niet aangepast aan de klant. Het wordt bereikbaar gemaakt."],
 e:"Accessibility: producten of diensten beschikbaar maken voor klanten die er eerst geen toegang toe hadden. Het boek noemt NetJets en ook beleggingsfondsen, waarmee mensen met weinig geld toch gespreid kunnen beleggen."},

{c:"bmc", q:"Met de iPod en iTunes maakte Apple het zoeken, kopen, downloaden en luisteren van muziek veel makkelijker dan ooit. Welk element van de Value Proposition is dit?",
 o:["Convenience/usability","Price","Risk reduction","Cost reduction"], a:0,
 w:["","Het ging niet om een lage prijs, maar om gemak.","Er wordt geen risico kleiner gemaakt.","Het gaat niet om kosten besparen, maar om iets makkelijker maken."],
 e:"Convenience/usability: dingen handiger of makkelijker in gebruik maken. Het boek noemt iPod en iTunes als voorbeeld."},

{c:"bmc", q:"Wat beschrijft het bouwblok Channels?",
 o:["Hoe een bedrijf communiceert met zijn klantsegmenten en hen bereikt om de Value Proposition te leveren","Wat voor band een bedrijf met zijn klanten heeft","Welke partners een bedrijf heeft","Hoeveel geld er binnenkomt"], a:0,
 w:["","Dat is Customer Relationships, blok 4.","Dat is Key Partnerships, blok 8.","Dat is Revenue Streams, blok 5."],
 e:"Channels (blok 3) gaat over hoe je de klant bereikt: communicatie-, distributie- en verkoopkanalen. Samen vormen ze de 'interface' tussen bedrijf en klant. Het zijn de contactpunten (touch points)."},

{c:"bmc", q:"Welke drie soorten kanalen vormen samen de 'interface' van een bedrijf met zijn klanten?",
 o:["Communicatie-, distributie- en verkoopkanalen","Directe, indirecte en digitale kanalen","Persoonlijke, geautomatiseerde en community-kanalen","Inkoop-, productie- en verkoopkanalen"], a:0,
 w:["","Direct en indirect bestaan wel, maar dit is niet het drietal dat de interface vormt.","Persoonlijk en geautomatiseerd zijn soorten klantrelaties, geen kanalen.","Inkoop en productie zijn interne activiteiten, geen contact met de klant."],
 e:"Het boek zegt: communicatie-, distributie- en verkoopkanalen vormen samen de interface van het bedrijf met de klant. Het zijn contactpunten die een grote rol spelen in de klantbeleving."},

{c:"bmc", q:"Wat is de juiste volgorde van de 5 fasen (functies) van een kanaal?",
 o:["Awareness, evaluatie, aankoop, levering, after sales","Evaluatie, awareness, aankoop, after sales, levering","Aankoop, awareness, levering, evaluatie, after sales","Awareness, aankoop, evaluatie, levering, after sales"], a:0,
 w:["","Je moet eerst weten dat iets bestaat (awareness) voor je het kan evalueren.","Je kan niet kopen voor je ervan gehoord hebt.","Je evalueert een product vóór je het koopt, niet erna."],
 e:"Volg de reis van de klant: hij hoort ervan (awareness), twijfelt en vergelijkt (evaluatie), koopt (aankoop), krijgt het (levering) en krijgt hulp achteraf (after sales)."},

{c:"bmc", q:"Een parfummerk deelt gratis staaltjes uit in de winkel, zodat klanten het geurtje kunnen uitproberen voordat ze kopen. Welke kanaalfase is dit vooral?",
 o:["Evaluatie","Awareness","Levering","After sales"], a:0,
 w:["","De klant staat al in de winkel en kent het product. Het gaat nu om beoordelen.","Levering is het product bij de klant krijgen na aankoop.","After sales is ondersteuning ná de aankoop."],
 e:"Evaluatie: klanten helpen om de Value Proposition te beoordelen. Een staaltje uitproberen is precies dat."},

{c:"bmc", q:"Welk onderscheid maakt het boek tussen eigen kanalen en partnerkanalen?",
 o:["Partnerkanalen geven lagere marges maar meer bereik. Eigen kanalen geven hogere marges maar zijn duur om op te zetten","Eigen kanalen geven altijd minder winst dan partnerkanalen","Partnerkanalen zijn altijd direct","Eigen kanalen zijn altijd goedkoper"], a:0,
 w:["","Het is andersom: eigen kanalen hebben juist hogere marges.","Partnerkanalen zijn volgens het boek indirect.","Eigen kanalen zijn juist duur om op te zetten en te runnen."],
 e:"Partnerkanalen (zoals groothandels of andermans winkels) leveren lagere marges op, maar je bereikt meer klanten en profiteert van de sterktes van de partner. Eigen kanalen, vooral directe, hebben hogere marges maar kosten veel om op te zetten. De kunst is de juiste mix."},

{c:"bmc", q:"Hoe deelt het boek 'een winkel die het bedrijf zelf bezit en runt' in?",
 o:["Eigen kanaal, indirect","Eigen kanaal, direct","Partnerkanaal, indirect","Partnerkanaal, direct"], a:0,
 w:["","Direct eigen zijn volgens het boek de eigen verkoopploeg (sales force) en de eigen website.","Het is geen partnerkanaal, want het bedrijf bezit de winkel zelf.","Partnerkanalen zijn volgens het boek altijd indirect."],
 e:"Volgens het boek kunnen eigen kanalen direct zijn (eigen verkoopploeg, eigen website) of indirect (eigen winkels). Partnerkanalen (partnerwinkels, groothandel) zijn indirect."},

{c:"bmc", q:"Welke van deze kanalen is volgens het boek een partnerkanaal?",
 o:["Een groothandel (wholesaler)","De eigen verkoopploeg (sales force)","De eigen webshop","De eigen winkels"], a:0,
 w:["","De eigen verkoopploeg is een eigen, direct kanaal.","De eigen website is een eigen, direct kanaal.","Eigen winkels zijn een eigen kanaal, ook al zijn ze indirect."],
 e:"Partnerkanalen zijn indirect: partnerwinkels en groothandels. Eigen kanalen zijn de verkoopploeg, de eigen website (direct) en eigen winkels (indirect)."},

{c:"bmc", q:"Wat beschrijft het bouwblok Customer Relationships?",
 o:["De soorten relaties die een bedrijf aangaat met specifieke klantsegmenten","De weg waarlangs het product bij de klant komt","De groepen klanten die een bedrijf bedient","De samenwerking met leveranciers"], a:0,
 w:["","Dat is Channels: langs waar je de klant bereikt.","Dat is Customer Segments, blok 1.","Samenwerking met leveranciers is Key Partnerships, blok 8."],
 e:"Customer Relationships (blok 4): wat voor band heeft het bedrijf met elk segment? Dat kan gaan van persoonlijk tot volledig geautomatiseerd."},

{c:"bmc", q:"Door welke drie motivaties kunnen klantrelaties gedreven worden?",
 o:["Klantenwerving, klantenbinding en meer verkopen (upselling)","Awareness, evaluatie en aankoop","Prijs, design en merk","Kosten, opbrengsten en winst"], a:0,
 w:["","Dat zijn fasen van Channels, geen motivaties voor relaties.","Dat zijn elementen van de Value Proposition.","Dat gaat over financiën, niet over klantrelaties."],
 e:"De drie motivaties zijn: customer acquisition (nieuwe klanten werven), customer retention (klanten houden) en boosting sales of upselling (bestaande klanten meer laten kopen)."},

{c:"bmc", q:"Mobiele operatoren gaven vroeger gratis gsm's weg. Toen de markt verzadigd raakte, focusten ze op klanten houden en meer opbrengst per klant. Wat leer je hieruit?",
 o:["De motivatie achter klantrelaties kan veranderen: van acquisitie naar retentie en upselling","Gratis gsm's weggeven is een vorm van retentie","Klantrelaties veranderen nooit","Operatoren schakelden van retentie naar acquisitie"], a:0,
 w:["","Gratis gsm's weggeven was bedoeld om nieuwe klanten te werven. Dat is acquisitie, geen retentie.","Het voorbeeld toont juist dat ze wel veranderen.","Het was net andersom: eerst acquisitie, daarna retentie."],
 e:"In het begin werden klanten agressief geworven met gratis gsm's (acquisitie). Toen iedereen al een gsm had, schakelden ze over naar klanten houden (retentie) en meer opbrengst per klant (upselling)."},

{c:"bmc", q:"Een klant kan tijdens en na de aankoop met een echte medewerker praten, in de winkel, via een callcenter of via e-mail. Welke soort klantrelatie is dit?",
 o:["Personal assistance","Dedicated personal assistance","Self-service","Automated services"], a:0,
 w:["","Bij dedicated personal assistance krijgt één klant een vaste eigen medewerker. Hier praat je met wie er op dat moment is.","Bij self-service is er geen direct contact met een medewerker.","Automated services werken met systemen, niet met een echte medewerker."],
 e:"Personal assistance is gebaseerd op menselijk contact: je kan een echte medewerker spreken tijdens of na de aankoop, ter plaatse, via een callcenter, per e-mail of op een andere manier."},

{c:"bmc", q:"Een private bank geeft elke zeer rijke klant een vaste eigen bankier, die de klant jarenlang persoonlijk begeleidt. Welke soort klantrelatie is dit?",
 o:["Dedicated personal assistance","Personal assistance","Communities","Co-creation"], a:0,
 w:["","Bij gewone personal assistance heb je geen vaste eigen medewerker. Hier wel.","Communities gaan over klanten die met elkaar in contact staan.","Co-creation gaat over samen met de klant waarde maken, zoals reviews schrijven."],
 e:"Dedicated personal assistance: één vaste medewerker voor één klant. Het is de diepste en meest persoonlijke relatie en groeit meestal over een lange periode. Ook key account managers bij belangrijke klanten zijn een voorbeeld."},

{c:"bmc", q:"Een bedrijf heeft geen direct contact met zijn klanten, maar geeft hen alle middelen om zichzelf te helpen. Welke soort klantrelatie is dit?",
 o:["Self-service","Automated services","Personal assistance","Communities"], a:0,
 w:["","Automated services gaan verder: het systeem herkent de klant en geeft persoonlijke info, zoals aanbevelingen.","Personal assistance draait juist om contact met een echte medewerker.","Bij communities helpen klanten elkaar via een gemeenschap."],
 e:"Self-service: het bedrijf onderhoudt geen directe relatie, maar zorgt dat klanten zichzelf kunnen helpen."},

{c:"bmc", q:"Een webwinkel herkent je bij het inloggen en geeft je boekaanbevelingen op basis van wat je eerder kocht. Welke soort klantrelatie is dit?",
 o:["Automated services","Self-service","Dedicated personal assistance","Co-creation"], a:0,
 w:["","Gewone self-service herkent de klant niet en geeft geen persoonlijke info.","Er is geen vaste menselijke medewerker.","Co-creation is de klant zelf waarde laten maken, zoals een review schrijven."],
 e:"Automated services zijn een slimmere vorm van self-service: het systeem herkent individuele klanten en hun kenmerken. Op hun best voelen ze aan als een persoonlijke relatie, zoals bij aanbevelingen voor boeken of films."},

{c:"bmc", q:"GlaxoSmithKline startte een online community toen het een nieuw afslankmiddel lanceerde. Wat was volgens het boek het doel?",
 o:["De uitdagingen van de klanten beter begrijpen en zo hun verwachtingen beter beheren","Het product goedkoper maken","Klanten zelf het product laten ontwerpen","Een vaste medewerker per klant aanstellen"], a:0,
 w:["","De community ging niet over de prijs.","Het product zelf laten ontwerpen is co-creation, niet het doel van deze community.","Een vaste medewerker per klant is dedicated personal assistance."],
 e:"Communities brengen klanten met elkaar in contact zodat ze kennis delen en elkaar helpen. Ze helpen het bedrijf ook om klanten beter te begrijpen. GSK wilde de uitdagingen van de gebruikers beter begrijpen."},

{c:"bmc", q:"Amazon.com laat klanten reviews schrijven die andere lezers helpen, en YouTube laat gebruikers zelf video's maken. Welke soort klantrelatie is dit?",
 o:["Co-creation","Communities","Self-service","Automated services"], a:0,
 w:["","Bij communities helpen klanten elkaar in een gemeenschap. Hier maken klanten zelf waarde voor andere klanten, dat is co-creation.","Bij self-service help je jezelf. Hier maak je iets voor anderen.","Automated services zijn systemen die de klant herkennen, zoals aanbevelingen."],
 e:"Co-creation: bedrijven gaan verder dan de gewone klant-leverancier-relatie en creëren samen met klanten waarde. Reviews schrijven (Amazon) en content maken (YouTube) zijn de voorbeelden uit het boek."},

{c:"bmc", q:"Welke uitspraak over de soorten klantrelaties klopt volgens het boek?",
 o:["Verschillende soorten relaties kunnen naast elkaar bestaan bij hetzelfde klantsegment","Een bedrijf mag per segment maar één soort relatie hebben","Geautomatiseerde relaties zijn altijd beter dan persoonlijke","Klantrelaties hebben geen invloed op de klantbeleving"], a:0,
 w:["","Het boek zegt juist dat ze naast elkaar kunnen bestaan.","Dat staat nergens in de stof. Het hangt af van het segment.","Het boek zegt dat de klantrelaties de totale klantbeleving sterk beïnvloeden."],
 e:"Het boek noemt verschillende categorieën klantrelaties die naast elkaar kunnen bestaan bij één segment. En de relaties die je kiest, beïnvloeden sterk de totale klantbeleving."},

{c:"bmc", q:"Wat zijn Revenue Streams volgens het boek?",
 o:["Inkomsten die ontstaan doordat Value Propositions met succes aan klanten worden aangeboden","De kosten die het bedrijf maakt","De middelen die nodig zijn om te produceren","De activiteiten die het bedrijf uitbesteedt"], a:0,
 w:["","Kosten horen bij de Cost Structure, blok 9.","Middelen zijn Key Resources, blok 6.","Uitbesteden hoort bij Key Partnerships, blok 8."],
 e:"Revenue Streams (blok 5): het geld dat binnenkomt doordat klanten de Value Proposition kopen."},

{c:"bmc", q:"Wat zijn Key Resources?",
 o:["De middelen die nodig zijn om alle eerder beschreven elementen aan te bieden en te leveren","De belangrijkste klanten van het bedrijf","De partners aan wie werk wordt uitbesteed","De inkomsten van het bedrijf"], a:0,
 w:["","De klanten zijn Customer Segments.","Partners zijn Key Partnerships.","Inkomsten zijn Revenue Streams."],
 e:"Key Resources (blok 6) zijn de belangrijkste middelen (assets) die je nodig hebt om de Value Proposition aan te bieden en te leveren."},

{c:"bmc", q:"Een fietsenwinkel repareert fietsen, onderhandelt met leveranciers en houdt zijn webshop bij. Bij welk bouwblok horen deze handelingen?",
 o:["Key Activities","Key Resources","Revenue Streams","Customer Segments"], a:0,
 w:["","Key Resources zijn de middelen (zoals gereedschap of het pand), niet de handelingen.","Revenue Streams gaat over het geld dat binnenkomt.","Customer Segments zijn de klantgroepen."],
 e:"Key Activities (blok 7): de belangrijkste dingen die een bedrijf moet doen om het businessmodel te laten werken. Middelen (blok 6) heb je, activiteiten (blok 7) doe je."},

{c:"bmc", q:"Wat beschrijft Key Partnerships volgens het boek?",
 o:["Sommige activiteiten worden uitbesteed en sommige middelen komen van buiten het bedrijf","De vaste relatie met de beste klanten","De verkoopkanalen via partnerwinkels","De groepen klanten die het bedrijf negeert"], a:0,
 w:["","Relaties met klanten horen bij Customer Relationships.","Partnerwinkels zijn een soort kanaal (Channels), geen Key Partnership in deze betekenis.","Dat hoort bij Customer Segments."],
 e:"Key Partnerships (blok 8): sommige activiteiten worden uitbesteed en sommige middelen worden buiten de organisatie gehaald, bijvoorbeeld bij leveranciers."},

{c:"bmc", q:"Waar komt de Cost Structure volgens het boek uit voort?",
 o:["Uit alle elementen van het businessmodel samen","Alleen uit de Revenue Streams","Alleen uit de Customer Segments","Uit de prijs die klanten betalen"], a:0,
 w:["","De opbrengsten zijn iets anders dan de kosten.","De klanten alleen bepalen niet alle kosten.","De prijs hoort bij opbrengsten, niet bij kosten."],
 e:"Het boek zegt: de elementen van het businessmodel leiden samen tot de kostenstructuur (blok 9). Alles wat je links op het canvas nodig hebt (middelen, activiteiten, partners) kost geld."},

{c:"bmc", q:"Welke volgorde van de 9 bouwblokken is juist?",
 o:["Customer Segments, Value Propositions, Channels, Customer Relationships, Revenue Streams, Key Resources, Key Activities, Key Partnerships, Cost Structure","Value Propositions, Customer Segments, Channels, Customer Relationships, Revenue Streams, Key Activities, Key Resources, Key Partnerships, Cost Structure","Customer Segments, Value Propositions, Customer Relationships, Channels, Revenue Streams, Key Resources, Key Activities, Key Partnerships, Cost Structure","Customer Segments, Value Propositions, Channels, Customer Relationships, Cost Structure, Key Resources, Key Activities, Key Partnerships, Revenue Streams"], a:0,
 w:["","Je begint bij de klant (Customer Segments), niet bij de Value Proposition. Ook Key Resources komt vóór Key Activities.","Channels (3) komt vóór Customer Relationships (4).","Revenue Streams is blok 5 en Cost Structure blok 9, niet omgekeerd."],
 e:"Lees het als een verhaal: voor wie (1), wat bieden we (2), hoe bereiken we ze (3), welke relatie (4), wat brengt het op (5), wat hebben we nodig (6), wat moeten we doen (7), met wie werken we samen (8), wat kost het (9)."}
);
// Hoofdstuk: Business Intelligence met Power BI (HC 3 en 4)
BANK.push(
{c:"bi", q:"Wat is Business Intelligence (BI)?",
 o:["Het proces van gegevens verzamelen, analyseren en rapporteren om beslissingen te nemen op basis van feiten","Een programma van Microsoft om grafieken te maken","Een formuletaal voor berekeningen","Het voorspellen van de toekomst met machine learning"], a:0,
 w:["","Dat is Power BI, een tool. BI zelf is het proces.","Dat is DAX.","Dat is Predictive Analytics, een geavanceerde techniek binnen het vakgebied."],
 e:"BI is een strategisch proces: je verzamelt en analyseert data zodat een organisatie beslissingen neemt op basis van feiten in plaats van buikgevoel, en zo beter presteert."},

{c:"bi", q:"Wat is het verschil tussen Business Intelligence en Power BI?",
 o:["BI is het proces, Power BI is een tool van Microsoft om dat proces uit te voeren","Er is geen verschil","Power BI is het proces, BI is de tool","BI gaat over kosten, Power BI over klanten"], a:0,
 w:["","Er is wel een verschil: proces tegenover programma.","Het is net andersom.","Geen van beide gaat specifiek over kosten of klanten."],
 e:"Denk aan koken (het proces) en een kookpot (het gereedschap). BI is het proces, Power BI is een softwareplatform waarmee je data visualiseert, analyseert en deelt."},

{c:"bi", q:"Waarvoor gebruiken bedrijven Power BI volgens de stof?",
 o:["Om gegevens om te zetten in bruikbare informatie met visuele rapportages en dashboards","Om producten te ontwerpen","Om personeel aan te nemen","Om de boekhouding wettelijk in te dienen"], a:0,
 w:["","Ontwerpen gebeurt met CAD-software, niet met Power BI.","Personeel aannemen hoort bij HRM.","Daar staat in de stof niets over. Power BI is voor analyse en visualisatie."],
 e:"Power BI is een BI-tool van Microsoft. Je zet ruwe data om in bruikbare informatie door ze te tonen in visuele rapporten en dashboards."},

{c:"bi", q:"Een manager wil elke ochtend in één oogopslag zien hoe het bedrijf ervoor staat: de belangrijkste KPI's, in grafieken en kaarten. Wat heeft hij nodig?",
 o:["Een dashboard","Een rapport","Een query","Een stermodel"], a:0,
 w:["","Een rapport is gedetailleerd en bedoeld voor diepere analyse, niet voor een snelle blik.","Een query haalt data op. Je kijkt er niet naar als manager.","Een stermodel is de manier waarop data intern is opgebouwd."],
 e:"Een dashboard is een visuele weergave van de belangrijkste KPI's en meetwaarden, zodat je snel de status en trends ziet. Denk aan het dashboard van een auto."},

{c:"bi", q:"Wat is het belangrijkste verschil tussen een dashboard en een rapport?",
 o:["Een dashboard geeft snel overzicht van KPI's, een rapport is gedetailleerd en onderbouwt beslissingen","Een rapport is altijd korter dan een dashboard","Een dashboard bevat nooit grafieken","Een rapport toont alleen KPI's"], a:0,
 w:["","Een rapport is juist uitgebreider en gedetailleerder.","Een dashboard bestaat juist uit grafieken, tabellen en kaarten.","KPI's in één oogopslag zijn typisch voor een dashboard."],
 e:"Dashboard = snel overzicht, KPI's, status en trends. Rapport = gestructureerd en gedetailleerd document met data en analyses, om informatie te delen en beslissingen te onderbouwen."},

{c:"bi", q:"Een directie moet beslissen of een vestiging dichtgaat en wil daarvoor een uitgebreide analyse van omzet en kosten per kwartaal. Wat past het best?",
 o:["Een rapport","Een dashboard","Data Refresh","Een KPI"], a:0,
 w:["","Een dashboard toont alleen het snelle overzicht, niet de uitgebreide analyse.","Data Refresh houdt data actueel, maar is zelf geen analyse.","Een KPI is één meetwaarde, geen volledige analyse."],
 e:"Een rapport is een gestructureerd, gedetailleerd document met data en analyses. Het wordt gebruikt om informatie te delen binnen de organisatie en beslissingen te onderbouwen."},

{c:"bi", q:"Wat is een gegevensmodel in Power BI?",
 o:["Een voorstelling van de gegevensbronnen en hun onderlinge relaties","Een grafiek met KPI's","Een verzoek om data op te halen","Een plan met verwachte inkomsten"], a:0,
 w:["","Dat is een dashboard.","Dat is een query.","Dat is een budget, uit het hoofdstuk kosten en opbrengsten."],
 e:"Een gegevensmodel is een (abstracte) voorstelling van je databronnen en hoe ze met elkaar verbonden zijn. Zie het als de plattegrond van je data, zodat je ze gestructureerd kan verkennen en analyseren."},

{c:"bi", q:"Een analist vraagt de database: 'geef mij alleen de verkopen van dit jaar uit België', om die data daarna te analyseren. Wat gebruikt hij?",
 o:["Een query","DAX","Een dashboard","Een KPI"], a:0,
 w:["","DAX gebruik je om te rekenen in het gegevensmodel, niet om data op te halen uit een bron.","Een dashboard toont resultaten, het haalt geen data op.","Een KPI is een meetwaarde, geen verzoek om data."],
 e:"Een query is een verzoek om data uit een bron op te halen of te transformeren. Je gebruikt het om data voor te bereiden op analyse. Een query kan data ook wijzigen of uit verschillende bronnen combineren."},

{c:"bi", q:"Wat is DAX (Data Analysis Expressions)?",
 o:["Een formuletaal in Power BI om eigen berekeningen en aggregaties te maken op het gegevensmodel","Een programma om data uit bronnen op te halen","Een type grafiek","Het proces om data op te kuisen"], a:0,
 w:["","Data ophalen doe je met een query.","DAX is geen grafiek maar een formuletaal.","Data opkuisen is Data Cleansing."],
 e:"DAX is de formuletaal van Power BI, een beetje zoals Excel-formules. Bijvoorbeeld: Totale omzet = SUM(Verkopen[Bedrag]). Je rekent ermee op data die al in het model zit."},

{c:"bi", q:"Een analist wil in Power BI de totale omzet berekenen door alle verkoopbedragen in het model op te tellen. Wat gebruikt hij?",
 o:["DAX, want dat is een berekening (aggregatie) op het gegevensmodel","Een query, want hij haalt data op","ETL, want hij laadt data in een warehouse","Data Cleansing, want hij verbetert de data"], a:0,
 w:["","De data zit al in het model. Hij rekent ermee, hij haalt niets op.","Hij laadt geen data, hij rekent.","Hij verbetert geen fouten, hij telt op."],
 e:"Een aggregatie is veel waarden samenvatten tot één getal (som, gemiddelde, aantal). Dat doe je met DAX in het gegevensmodel. Ezelsbrug: query = ophalen en voorbereiden, DAX = rekenen."},

{c:"bi", q:"Waar staan de letters van ETL voor?",
 o:["Extract, Transform, Load","Evaluate, Test, Launch","Export, Translate, Link","Extract, Test, Load"], a:0,
 w:["","Dit zijn verzonnen woorden die niet in de stof staan.","Ook deze woorden staan niet in de stof.","De T staat voor Transform (omvormen), niet voor Test."],
 e:"ETL = Extract (ophalen uit verschillende bronnen), Transform (omvormen en opkuisen tot een bruikbare vorm), Load (laden in een datawarehouse). Ezelsbrug: halen, poetsen, wegzetten."},

{c:"bi", q:"Een webshop haalt data uit zijn bestelsysteem, Excel en boekhouding, maakt alle datums hetzelfde, en zet alles samen in een datawarehouse. Welk proces is dit?",
 o:["ETL","Predictive Analytics","Data Refresh","DAX"], a:0,
 w:["","Er wordt niets voorspeld.","Data Refresh werkt bestaande rapporten bij. Hier wordt data opgehaald, omgevormd en centraal opgeslagen.","DAX is een formuletaal om te rekenen."],
 e:"Ophalen uit verschillende bronnen (Extract), omvormen tot één formaat (Transform) en centraal opslaan in een datawarehouse (Load): dat is ETL."},

{c:"bi", q:"In welke stap van ETL wordt de ruwe data opgeschoond en omgevormd voor analyse?",
 o:["Transform","Extract","Load","Na ETL, in het dashboard"], a:0,
 w:["","Extract is alleen het ophalen.","Load is het laden in het datawarehouse, als de data al klaar is.","Het opschonen gebeurt binnen ETL, niet pas in het dashboard."],
 e:"In de Transform-stap wordt de data omgevormd en opgeschoond. Data Cleansing hoort dus bij de T van ETL."},

{c:"bi", q:"Waar wordt de data in de laatste stap van ETL in geladen?",
 o:["Een datawarehouse","Een dashboard","Een DAX-formule","Een KPI"], a:0,
 w:["","Een dashboard toont data, maar de L van ETL laadt in een datawarehouse.","DAX is een formuletaal, geen opslagplaats.","Een KPI is een meetwaarde."],
 e:"In de Load-stap wordt de data geladen in een datawarehouse: een centrale opslag, klaar voor rapportage en analyse."},

{c:"bi", q:"Wat is een KPI (Key Performance Indicator)?",
 o:["Een meetbare indicator die toont of een organisatie vooruitgaat richting haar strategische doelen","Elk getal dat een bedrijf bijhoudt","Een formule in Power BI","Een overzicht van bezittingen en schulden"], a:0,
 w:["","Niet elk getal is een KPI. Het moet aan een doel gekoppeld zijn.","Een formule in Power BI is DAX.","Dat is een balans."],
 e:"Een KPI is meetbaar en gekoppeld aan een strategisch doel. Het woord 'key' zegt het al: het gaat om de belangrijkste metingen. Doel '20% meer omzet' geeft als KPI 'omzetgroei'."},

{c:"bi", q:"Een bedrijf heeft als doel om klanten tevredener te maken. Welke meting is daarvoor de beste KPI?",
 o:["De gemiddelde klanttevredenheidsscore","Het aantal stoelen in de kantine","De kleur van het logo","Het aantal ramen in het gebouw"], a:0,
 w:["","Dat heeft niets met het doel te maken.","Dat is niet meetbaar en heeft niets met het doel te maken.","Dat heeft niets met het doel te maken."],
 e:"Een KPI moet meetbaar zijn en rechtstreeks meten of je je doel haalt. Een tevredenheidsscore meet precies of klanten tevredener worden."},

{c:"bi", q:"Wat is een stermodel?",
 o:["Een dimensioneel model met een centrale feitentabel die via sleutels verbonden is met dimensietabellen","Een grafiek in de vorm van een ster","Een model met vijf gelijkwaardige tabellen in een cirkel","Een overzicht van de vijf componenten van Mintzberg"], a:0,
 w:["","Het is geen grafiek, maar een manier om data te structureren.","De tabellen zijn niet gelijkwaardig: er is één centrale feitentabel.","Mintzberg hoort bij procesmanagement en heeft niets met het stermodel te maken."],
 e:"In een stermodel staat één feitentabel in het midden, verbonden via sleutels met dimensietabellen eromheen. Getekend lijkt het op een ster. Dit maakt rapportage eenvoudig en efficiënt."},

{c:"bi", q:"Een ketting fitnesscentra bouwt een stermodel met de tabellen Lid, Vestiging, Datum, Abonnementstype en Bezoeken. Welke is de feitentabel?",
 o:["Bezoeken","Lid","Vestiging","Abonnementstype"], a:0,
 w:["","Lid is een dimensie: je gebruikt het om te groeperen (bezoeken per lid).","Vestiging is een dimensie: bezoeken per vestiging.","Abonnementstype is een dimensie: bezoeken per type."],
 e:"De feitentabel bevat de gebeurtenissen die je telt: elk bezoek. De rest zijn dimensies: die beschrijven het wie, wat, waar en wanneer. Ezelsbrug: feiten tel je op, dimensies gebruik je om te groeperen."},

{c:"bi", q:"Waarvoor gebruik je dimensietabellen in een stermodel?",
 o:["Om de feiten te beschrijven en te groeperen, bijvoorbeeld per klant, product of maand","Om alle bedragen in op te tellen","Om data op te halen uit de bron","Om de data te verversen"], a:0,
 w:["","De bedragen staan in de feitentabel.","Ophalen doe je met een query of de E van ETL.","Verversen is Data Refresh."],
 e:"Dimensietabellen beschrijven de gebeurtenissen uit de feitentabel: wie (klant), wat (product), wanneer (datum), waar (winkel). Je gebruikt ze om te groeperen, zoals 'omzet per maand'."},

{c:"bi", q:"Een dashboard toont de verkopen van vorige maand, terwijl er sindsdien veel verkocht is. Wat ontbreekt er?",
 o:["Data Refresh","Een stermodel","DAX","Een query"], a:0,
 w:["","Het model kan prima zijn. Het probleem is dat de data oud is.","De berekeningen kunnen kloppen, maar ze rekenen met oude data.","Het probleem is niet het ophalen zelf, maar dat de data niet bijgewerkt wordt."],
 e:"Data Refresh is het bijwerken van de data in Power BI met de nieuwste gegevens uit de bronnen. Zo zijn rapporten en dashboards altijd actueel en beslis je niet op oude informatie."},

{c:"bi", q:"Waarom is Data Refresh volgens de stof zo belangrijk?",
 o:["Omdat tijdige vernieuwing van de data essentieel is om besluitvorming te ondersteunen","Omdat het fouten in de data verbetert","Omdat het de toekomst voorspelt","Omdat het de data in een datawarehouse laadt"], a:0,
 w:["","Fouten verbeteren is Data Cleansing.","Voorspellen is Predictive Analytics.","Laden in een datawarehouse is de L van ETL."],
 e:"Met verouderde data neem je verkeerde beslissingen. Data Refresh zorgt dat gebruikers altijd met actuele informatie werken."},

{c:"bi", q:"In een klantenbestand staan dubbele klanten, ontbrekende postcodes en getallen die als tekst zijn opgeslagen. Welk begrip gaat over het oplossen hiervan?",
 o:["Data Cleansing","Data Refresh","Predictive Analytics","Stermodel"], a:0,
 w:["","Data Refresh haalt nieuwe data op, maar verbetert geen fouten.","Er wordt niets voorspeld.","Een stermodel is de structuur van het model, niet het verbeteren van fouten."],
 e:"Data Cleansing is het opsporen en corrigeren van foute, onvolledige of inconsistente data, zoals ontbrekende waarden of verkeerde datatypes. Zo wordt de data nauwkeurig en betrouwbaar."},

{c:"bi", q:"Bij welk proces hoort Data Cleansing volgens de stof?",

 w:["","DAX rekent met data, het kuist niets op.","Opkuisen gebeurt vóór de analyse, anders zijn je conclusies fout.","Predictive Analytics voorspelt, het kuist niets op."],
 e:"De stof zegt letterlijk: Data Cleansing is een belangrijke stap in het ETL-proces. Het hoort bij de T, Transform."},

{c:"bi", q:"Een supermarkt gebruikt verkoopcijfers van de afgelopen vijf jaar en machine learning om te voorspellen hoeveel ijs er volgende zomer verkocht wordt. Welk begrip is dit?",
 o:["Predictive Analytics","Data Refresh","ETL","Een rapport"], a:0,
 w:["","Data Refresh werkt data bij, maar voorspelt niets.","ETL haalt data op en kuist ze op, maar voorspelt niets.","Een rapport toont wat er gebeurd is, het voorspelt niet."],
 e:"Predictive Analytics: statistische modellen en machine learning gebruiken om op basis van historische data de toekomst te voorspellen. Zo kan een organisatie proactief beslissingen nemen en plannen."},

{c:"bi", q:"Wat is het grote verschil tussen gewone rapportage en Predictive Analytics?",
 o:["Rapportage kijkt naar wat er gebeurd is, Predictive Analytics voorspelt wat er gaat gebeuren","Predictive Analytics gebruikt geen data","Rapportage gebruikt machine learning","Er is geen verschil"], a:0,
 w:["","Predictive Analytics gebruikt juist historische data.","Machine learning hoort bij Predictive Analytics.","Er is wel een verschil: verleden tegenover toekomst."],
 e:"Gewone BI-rapportage kijkt achteruit: 'wat is er gebeurd?'. Predictive Analytics kijkt vooruit: 'wat gaat er gebeuren?'. Zo kan je proactief handelen."},

{c:"bi", q:"Welke volgorde beschrijft hoe data door het BI-proces stroomt?",
 o:["ETL, gegevensmodel, DAX-berekeningen, dashboard","Dashboard, DAX, gegevensmodel, ETL","DAX, ETL, dashboard, gegevensmodel","Gegevensmodel, dashboard, ETL, DAX"], a:0,
 w:["","Een dashboard toon je pas op het einde, als de data klaar is.","Je kan pas rekenen met DAX als er data in het model zit.","Het model kan pas gevuld worden nadat de data via ETL binnengehaald is."],
 e:"Eerst haal je de data binnen en kuis je ze op (ETL), dan structureer je ze (gegevensmodel), dan reken je ermee (DAX), en tot slot toon je ze (dashboard of rapport)."},

{c:"bi", q:"Een bedrijf heeft een prachtig dashboard, maar de data bevat veel dubbele en foute records. Wat is het gevolg?",
 o:["De conclusies kunnen fout zijn, hoe mooi het dashboard ook is","Het dashboard corrigeert de fouten automatisch","Het maakt niet uit, zolang er Data Refresh is","Het dashboard wordt alleen trager"], a:0,

);
// Hoofdstuk: Kosten en Opbrengsten (HC 5)
BANK.push(
{c:"kosten", q:"Wat is het break-evenpunt?",
 o:["De verkoop- of productieomvang waarbij er geen winst en geen verlies is","Het punt waarop een bedrijf de meeste winst maakt","De verkoopprijs min de variabele kosten","Het moment waarop alle schulden betaald zijn"], a:0,
 w:["","Bij het break-evenpunt is de winst juist nul.","Dat is de contributiemarge.","Schulden afbetalen heeft niets met het break-evenpunt te maken."],
 e:"Bij het break-evenpunt zijn opbrengsten en kosten precies gelijk: je speelt quitte. Alles wat je daarboven verkoopt is winst, alles daaronder is verlies."},

{c:"kosten", q:"Een bedrijf verkoopt precies evenveel als zijn break-evenpunt. Wat is het resultaat?",
 o:["Geen winst en geen verlies","Een kleine winst","Een klein verlies","Dat hangt af van de vaste kosten"], a:0,
 w:["","Winst begint pas boven het break-evenpunt.","Verlies is er alleen onder het break-evenpunt.","Het break-evenpunt houdt al rekening met de vaste kosten. Het resultaat is altijd nul."],
 e:"Dat is precies de definitie: bij het break-evenpunt is het resultaat nul. Opbrengsten = totale kosten."},

{c:"kosten", q:"Wat zijn totale variabele kosten?",
 o:["Kosten die stijgen als er meer geproduceerd wordt en dalen als er minder geproduceerd wordt","Kosten die nooit veranderen","Kosten die elk jaar stijgen door inflatie","Kosten die alleen in de zomer voorkomen"], a:0,
 w:["","Dat zijn vaste kosten.","Variabel gaat over meebewegen met de productie, niet met de tijd.","Variabel betekent niet seizoensgebonden. Het gaat om de hoeveelheid productie."],
 e:"Variabele kosten bewegen mee met hoeveel je produceert. Test: 'Als ik niets verkoop, betaal ik dit dan nog?' Nee? Dan is het variabel."},

{c:"kosten", q:"Wat zijn totale vaste kosten?",
 o:["Kosten die niet veranderen als er meer of minder geproduceerd wordt","Kosten die nooit meer veranderen, ook niet over jaren","Kosten per geproduceerd stuk","Kosten die alleen bij grote bedrijven voorkomen"], a:0,
 w:["","Vast betekent alleen: niet afhankelijk van de productie. De huur kan volgend jaar best stijgen.","Kosten per stuk die meebewegen zijn variabel.","Elk bedrijf heeft vaste kosten, groot of klein."],
 e:"Vaste kosten blijven gelijk, of je nu 0 of 10.000 stuks maakt. Test: 'Betaal ik dit ook als ik niets verkoop?' Ja? Dan is het vast. Voorbeelden: huur, verzekering."},

{c:"kosten", q:"Welke kost is VAST voor een bakkerij?",
 o:["De maandhuur van het pand","Het meel per brood","De papieren zakjes per brood","De gist per brood"], a:0,
 w:["","Hoe meer brood, hoe meer meel. Dat is variabel.","Hoe meer brood, hoe meer zakjes. Dat is variabel.","Hoe meer brood, hoe meer gist. Dat is variabel."],
 e:"De huur betaal je ook als je geen enkel brood bakt. Die beweegt niet mee met de productie, dus is ze vast."},

{c:"kosten", q:"Welke kost is VARIABEL voor een webshop in telefoonhoesjes?",
 o:["De verzendkosten per pakket","De maandelijkse huur van het magazijn","Het vaste loon van de boekhouder","De jaarlijkse verzekering"], a:0,
 w:["","Huur betaal je ook als je niets verkoopt. Vast.","Een vast loon verandert niet met de verkoop. Vast.","Een verzekering betaal je sowieso. Vast."],
 e:"Hoe meer pakketten je verstuurt, hoe meer verzendkosten. Bij 0 verkopen betaal je ze niet. Dat maakt ze variabel."},

{c:"kosten", q:"De huur van een bedrijf stijgt volgend jaar. Blijft de huur dan een vaste kost?",
 o:["Ja, want vast betekent dat de kost niet meebeweegt met de productie, niet dat hij nooit verandert","Nee, want hij verandert","Nee, hij wordt een variabele kost","Dat hangt af van de verkoopprijs"], a:0,
 w:["","Veranderen in de tijd maakt een kost niet variabel. Het gaat om de link met productie.","Variabel zou betekenen dat de huur stijgt als je meer produceert. Dat is niet zo.","De verkoopprijs heeft niets te maken met of een kost vast of variabel is."],
 e:"Vaste kosten veranderen niet als je meer of minder produceert. Ze kunnen wel stijgen door een nieuw huurcontract. Het blijft een vaste kost."},

{c:"kosten", q:"Wat geeft een verdienmodel aan?",
 o:["Hoe je geld verdient met je bedrijf","Hoeveel kosten een bedrijf heeft","Hoe de organisatie is opgebouwd","Welke software een bedrijf gebruikt"], a:0,
 w:["","Kosten horen bij de kostenstructuur, niet bij het verdienmodel.","Dat is een organigram.","Dat is het applicatielandschap."],

// Rekenvragen: elke keer nieuwe getallen
const eur = n => (n<0?"−€":"€") + Math.abs(n).toLocaleString("nl-NL");
const nr = n => n.toLocaleString("nl-NL");
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const PRODUCTEN = [["kaarsen","kaars"],["rugzakken","rugzak"],["bordspellen","bordspel"],["fietslampjes","fietslampje"],["koffiebekers","koffiebeker"],["T-shirts","T-shirt"],["skateboards","skateboard"],["boeken","boek"],["zonnebrillen","zonnebril"],["petten","pet"],["plantenpotten","plantenpot"],["koptelefoons","koptelefoon"]];

GENS.push(
{c:"kosten", gen(){
  const [mv,ev]=pick(PRODUCTEN); const cm=rnd(3,25); const bep=rnd(4,40)*50; const F=cm*bep; const v=rnd(2,30); const p=v+cm;
  const fout1=Math.round(F/p), fout2=Math.round(F/v), fout3=Math.round(F/(p+v));
  return {q:`Een bedrijf verkoopt ${mv} aan ${eur(p)} per ${ev}. De variabele kosten zijn ${eur(v)} per ${ev} en de vaste kosten ${eur(F)} per maand. Wat is het break-evenpunt?`,
   o:[nr(bep)+" "+mv, nr(fout1)+" "+mv, nr(fout2)+" "+mv, nr(fout3)+" "+mv], a:0,
   w:["",`Je deelde de vaste kosten door de verkoopprijs (${eur(F)} ÷ ${eur(p)}). Maar van elke verkoop gaat eerst ${eur(v)} naar variabele kosten. Je moet delen door de contributiemarge.`,`Je deelde door de variabele kosten (${eur(F)} ÷ ${eur(v)}). Je moet delen door wat er per stuk overblijft: de contributiemarge.`,`Je deelde door prijs plus variabele kosten. De variabele kosten moet je juist aftrekken van de prijs, niet optellen.`],
   e:`Stap 1, contributiemarge: ${eur(p)} − ${eur(v)} = ${eur(cm)} per ${ev}. Stap 2, break-evenpunt: vaste kosten ÷ contributiemarge = ${eur(F)} ÷ ${eur(cm)} = ${nr(bep)} ${mv}. Controle: ${nr(bep)} × ${eur(cm)} = ${eur(F)}, precies genoeg om de vaste kosten te betalen.`};
}},
{c:"kosten", gen(){
  const [mv,ev]=pick(PRODUCTEN); const v=rnd(2,20); const cm=rnd(4,20); const p=v+cm; const n=rnd(3,30)*50; let F=rnd(4,60)*250;
  const res=cm*n-F; const f1=p*n-F, f2=cm*n, f3=v*n-F;
  const lbl = x => x>=0 ? eur(x)+" winst" : eur(-x)+" verlies";
  return {q:`Een bedrijf verkoopt ${mv} aan ${eur(p)} per ${ev}. De variabele kosten zijn ${eur(v)} per ${ev} en de vaste kosten ${eur(F)} per maand. Deze maand worden ${nr(n)} ${mv} verkocht. Wat is het resultaat?`,
   o:[lbl(res), lbl(f1), lbl(f2), lbl(f3)], a:0,
   w:["",`Je vergat de variabele kosten. Van elke verkoop gaat eerst ${eur(v)} naar variabele kosten, dus je moet met de contributiemarge rekenen.`,`Je vergat de vaste kosten van ${eur(F)} af te trekken. De contributiemarge moet eerst de vaste kosten dekken, pas daarna is er winst.`,`Je rekende met de variabele kosten per stuk (${eur(v)}) in plaats van met de contributiemarge (${eur(cm)}).`],
   e:`Stap 1, contributiemarge: ${eur(p)} − ${eur(v)} = ${eur(cm)}. Stap 2, totale bijdrage: ${nr(n)} × ${eur(cm)} = ${eur(cm*n)}. Stap 3, vaste kosten eraf: ${eur(cm*n)} − ${eur(F)} = ${eur(res)}. Dat is ${res>=0?"winst":"verlies"}${res<0?", want er zijn minder stuks verkocht dan het break-evenpunt":""}.`};
}},
{c:"kosten", gen(){
  const [mv,ev]=pick(PRODUCTEN); const v=rnd(2,25); const cm=rnd(2,25); const p=v+cm; const n=rnd(4,40)*25;
  const omzet=p*n, tvk=v*n;
  return {q:`Een bedrijf verkocht ${nr(n)} ${mv}. De omzet was ${eur(omzet)} en de totale variabele kosten waren ${eur(tvk)}. Wat is de contributiemarge per ${ev}?`,
   o:[eur(cm), eur(p), eur(v), eur(omzet-tvk)], a:0,
   w:["",`Dat is de verkoopprijs per stuk (${eur(omzet)} ÷ ${nr(n)}). Je moet er nog de variabele kosten per stuk van aftrekken.`,`Dat zijn de variabele kosten per stuk (${eur(tvk)} ÷ ${nr(n)}). De contributiemarge is wat er overblijft ná die kosten.`,`Dat is de totale bijdrage van alle stuks samen. De contributiemarge is per stuk, dus je moet nog delen door ${nr(n)}.`],
   e:`Verkoopprijs per stuk: ${eur(omzet)} ÷ ${nr(n)} = ${eur(p)}. Variabele kosten per stuk: ${eur(tvk)} ÷ ${nr(n)} = ${eur(v)}. Contributiemarge = ${eur(p)} − ${eur(v)} = ${eur(cm)} per ${ev}.`};
}},
{c:"kosten", gen(){
  const [mv,ev]=pick(PRODUCTEN); const cm=rnd(3,20); const bep=rnd(4,40)*50; const F=cm*bep; let v=rnd(2,20); if(v===cm) v+=1; const p=v+cm;
  const opts=[eur(p), eur(cm), eur(cm*2+v), eur(Math.abs(cm-v)||cm+1)];
  return {q:`Een bedrijf heeft ${eur(F)} vaste kosten per maand en variabele kosten van ${eur(v)} per ${ev}. Het break-evenpunt ligt op ${nr(bep)} ${mv}. Wat is de verkoopprijs per ${ev}?`,
   o:opts, a:0,
   w:["",`Dat is de contributiemarge (${eur(F)} ÷ ${nr(bep)}). De verkoopprijs is contributiemarge plus variabele kosten.`,`Je telde de contributiemarge twee keer. Verkoopprijs = één keer de contributiemarge plus de variabele kosten.`,`Je trok de variabele kosten af in plaats van ze op te tellen. Prijs min variabele kosten is de contributiemarge, dus prijs = contributiemarge plus variabele kosten.`],
   e:`Omgekeerd rekenen. Stap 1: contributiemarge = vaste kosten ÷ break-evenpunt = ${eur(F)} ÷ ${nr(bep)} = ${eur(cm)}. Stap 2: verkoopprijs = contributiemarge + variabele kosten = ${eur(cm)} + ${eur(v)} = ${eur(p)}.`};
}},
{c:"kosten", gen(){
  const A=rnd(20,200)*1000; const S=rnd(5,Math.floor(A/1000)-3)*1000; const EV=A-S;
  const d=pick(["31 december","30 juni","31 maart","30 september"]);
  return {q:`Op ${d} heeft een bedrijf ${eur(A)} aan activa en ${eur(S)} aan passiva (schulden en verplichtingen). Hoe groot is het eigen vermogen?`,
   o:[eur(EV), eur(A+S), eur(S), eur(A)], a:0,
   w:["","Je telde activa en passiva op. Het eigen vermogen is wat overblijft als je de schulden aftrekt van wat je bezit.","Dat zijn de schulden. Het eigen vermogen is wat er na de schulden overblijft.","Dat zijn alle bezittingen. Daar moet je de schulden nog van aftrekken."],
   e:`Eigen vermogen = activa − passiva = ${eur(A)} − ${eur(S)} = ${eur(EV)}. Dit staat op de balans, die de positie op één moment toont (hier: ${d}).`};
}}
);
